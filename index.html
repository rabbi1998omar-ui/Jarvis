<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#0b0714"
>

<title>ময়না পাখি 🐦</title>


<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  min-height:100vh;

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Bengali",
    sans-serif;

  color:white;

  background:
    radial-gradient(
      circle at top,
      #4b236b 0%,
      #1c102b 35%,
      #090711 75%
    );

  overflow-x:hidden;
}


/* =====================================================
   APP
===================================================== */

.app{

  width:100%;
  max-width:520px;

  min-height:100vh;

  margin:auto;

  display:flex;
  flex-direction:column;

  position:relative;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.03),
      rgba(0,0,0,.12)
    );
}


/* =====================================================
   HEADER
===================================================== */

.header{

  padding:22px 20px 12px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{

  display:flex;
  align-items:center;
  gap:10px;
}

.logo-icon{

  width:44px;
  height:44px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:25px;

  background:
    linear-gradient(
      135deg,
      #ff5caa,
      #7447ff
    );

  box-shadow:
    0 8px 30px
    rgba(255,70,160,.25);
}

.logo-text h1{

  font-size:21px;
  font-weight:800;
}

.logo-text p{

  color:#bdb3ca;

  font-size:12px;

  margin-top:2px;
}

.status{

  display:flex;
  align-items:center;
  gap:6px;

  color:#bdb3ca;

  font-size:11px;
}

.status-dot{

  width:8px;
  height:8px;

  border-radius:50%;

  background:#45e68a;

  box-shadow:
    0 0 12px #45e68a;
}


/* =====================================================
   GIRL
===================================================== */

.avatar-area{

  display:flex;
  justify-content:center;
  align-items:center;

  padding:
    10px
    20px
    4px;
}

.girl{

  width:190px;
  height:220px;

  position:relative;

  animation:
    floatGirl 4s ease-in-out infinite;
}

@keyframes floatGirl{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-7px);
  }
}


/* hair */

.hair{

  position:absolute;

  width:150px;
  height:190px;

  left:20px;
  top:5px;

  border-radius:
    80px 80px 55px 55px;

  background:
    linear-gradient(
      145deg,
      #171323,
      #3d1c55
    );

  box-shadow:
    0 20px 40px
    rgba(0,0,0,.4);
}


/* face */

.face{

  position:absolute;

  width:105px;
  height:125px;

  left:42px;
  top:35px;

  border-radius:
    48% 48% 46% 46%;

  background:
    linear-gradient(
      145deg,
      #ffd7c2,
      #eeb29d
    );

  z-index:2;

  box-shadow:
    inset -7px -8px 15px
    rgba(130,55,50,.12);
}


/* hair front */

.hair-front{

  position:absolute;

  width:115px;
  height:65px;

  left:36px;
  top:20px;

  border-radius:
    65px 65px 25px 20px;

  background:
    linear-gradient(
      145deg,
      #181324,
      #49215c
    );

  z-index:3;
}


/* eyes */

.eye{

  position:absolute;

  width:22px;
  height:14px;

  top:78px;

  background:white;

  border-radius:50%;

  z-index:5;

  overflow:hidden;

  animation:
    blink 5s infinite;
}

.eye.left{
  left:61px;
}

.eye.right{
  left:106px;
}

.eye::after{

  content:"";

  position:absolute;

  width:9px;
  height:9px;

  left:7px;
  top:3px;

  border-radius:50%;

  background:#3b174d;
}

@keyframes blink{

  0%,45%,48%,100%{
    transform:scaleY(1);
  }

  46%,47%{
    transform:scaleY(.08);
  }
}


/* nose */

.nose{

  position:absolute;

  left:90px;
  top:92px;

  width:8px;
  height:13px;

  border-left:
    2px solid rgba(120,70,70,.18);

  z-index:5;
}


/* mouth */

.mouth{

  position:absolute;

  left:80px;
  top:112px;

  width:28px;
  height:8px;

  border-radius:
    0 0 18px 18px;

  border-bottom:
    3px solid #b34c70;

  z-index:5;

  transition:.15s;
}

.speaking .mouth{

  height:18px;

  background:#8d3154;

  border:
    2px solid #64203c;

  animation:
    mouthTalk .18s infinite alternate;
}

@keyframes mouthTalk{

  from{
    transform:scaleY(.6);
  }

  to{
    transform:scaleY(1);
  }
}


/* body */

.body{

  position:absolute;

  width:125px;
  height:75px;

  left:33px;
  top:150px;

  border-radius:
    55px 55px 20px 20px;

  background:
    linear-gradient(
      135deg,
      #a348c9,
      #5532a7
    );

  z-index:1;

  box-shadow:
    0 15px 30px
    rgba(88,37,130,.35);
}


/* =====================================================
   WELCOME
===================================================== */

.welcome{

  text-align:center;

  padding:
    4px
    20px
    16px;
}

.welcome h2{

  font-size:24px;

  margin-bottom:6px;
}

.welcome p{

  color:#bdb3ca;

  font-size:13px;
}


/* =====================================================
   CHAT
===================================================== */

.chat{

  flex:1;

  padding:
    5px
    16px
    125px;

  overflow-y:auto;
}

.message{

  display:flex;

  margin:
    8px
    0;
}

.message.user{

  justify-content:flex-end;
}

.bubble{

  max-width:82%;

  padding:
    11px
    14px;

  border-radius:18px;

  line-height:1.55;

  font-size:14px;

  white-space:pre-wrap;
}

.message.ai .bubble{

  background:
    rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.07);

  border-bottom-left-radius:5px;
}

.message.user .bubble{

  background:
    linear-gradient(
      135deg,
      #ff4e9b,
      #7547ff
    );

  border-bottom-right-radius:5px;
}


/* =====================================================
   QUICK BUTTONS
===================================================== */

.quick{

  display:flex;

  gap:8px;

  overflow-x:auto;

  padding:
    7px
    16px;

  scrollbar-width:none;
}

.quick::-webkit-scrollbar{
  display:none;
}

.quick button{

  flex-shrink:0;

  border:0;

  color:white;

  padding:
    9px
    13px;

  border-radius:20px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.08);

  cursor:pointer;

  font-size:12px;
}


/* =====================================================
   INPUT
===================================================== */

.bottom{

  position:fixed;

  left:50%;

  transform:translateX(-50%);

  bottom:0;

  width:100%;
  max-width:520px;

  padding:
    10px
    14px
    16px;

  background:
    linear-gradient(
      180deg,
      rgba(9,7,17,0),
      #090711 25%
    );

  z-index:20;
}

.input-row{

  display:flex;

  gap:8px;

  padding:8px;

  border-radius:25px;

  background:
    rgba(255,255,255,.07);

  border:
    1px solid
    rgba(255,255,255,.08);

  backdrop-filter:blur(15px);
}

.input{

  flex:1;

  min-width:0;

  border:0;
  outline:0;

  color:white;

  background:transparent;

  font-size:14px;

  padding:
    8px
    10px;
}

.input::placeholder{
  color:#92899d;
}

.icon-btn{

  width:42px;
  height:42px;

  border:0;

  border-radius:50%;

  color:white;

  background:
    rgba(255,255,255,.08);

  cursor:pointer;

  font-size:17px;
}

.send-btn{

  width:44px;
  height:44px;

  border:0;

  border-radius:50%;

  color:white;

  background:
    linear-gradient(
      135deg,
      #ff4f9b,
      #7547ff
    );

  cursor:pointer;

  font-size:18px;

  box-shadow:
    0 5px 20px
    rgba(168,72,255,.3);
}


/* =====================================================
   CONTROLS
===================================================== */

.controls{

  display:flex;

  justify-content:center;

  gap:8px;

  margin-top:8px;
}

.control{

  border:0;

  background:transparent;

  color:#8f8799;

  font-size:11px;

  cursor:pointer;
}


/* =====================================================
   TYPING
===================================================== */

.typing{

  display:flex;

  gap:4px;

  align-items:center;
}

.typing span{

  width:5px;
  height:5px;

  border-radius:50%;

  background:#c9b7d9;

  animation:
    typing .8s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes typing{

  0%,100%{
    transform:translateY(0);
    opacity:.4;
  }

  50%{
    transform:translateY(-4px);
    opacity:1;
  }
}


@media(max-width:380px){

  .girl{
    transform:scale(.88);
    margin-bottom:-15px;
  }

  .welcome h2{
    font-size:21px;
  }

}

</style>

</head>


<body>


<div class="app">


  <!-- HEADER -->

  <header class="header">

    <div class="logo">

      <div class="logo-icon">
        🐦
      </div>

      <div class="logo-text">

        <h1>ময়না পাখি</h1>

        <p>তোমার AI সঙ্গী</p>

      </div>

    </div>


    <div class="status">

      <span class="status-dot"></span>

      অনলাইন

    </div>

  </header>



  <!-- GIRL -->

  <section class="avatar-area">

    <div
      class="girl"
      id="girl"
    >

      <div class="hair"></div>

      <div class="face"></div>

      <div class="hair-front"></div>

      <div class="eye left"></div>

      <div class="eye right"></div>

      <div class="nose"></div>

      <div class="mouth"></div>

      <div class="body"></div>

    </div>

  </section>



  <!-- WELCOME -->

  <section class="welcome">

    <h2>হ্যালো! আমি ময়না পাখি 🐦</h2>

    <p>
      তোমার সাথে কথা বলতে আমি প্রস্তুত।
    </p>

  </section>



  <!-- CHAT -->

  <main
    class="chat"
    id="chat"
  >

    <div class="message ai">

      <div class="bubble">

        হ্যালো! আমি ময়না পাখি। ❤️
        আমাকে কিছু জিজ্ঞেস করো।

      </div>

    </div>

  </main>



  <!-- QUICK -->

  <div class="quick">

    <button onclick="quickAsk('তুমি কে?')">
      তুমি কে?
    </button>

    <button onclick="quickAsk('আজ কেমন আছো?')">
      কেমন আছো?
    </button>

    <button onclick="quickAsk('একটা মজার কথা বলো')">
      মজার কথা
    </button>

    <button onclick="quickAsk('আমাকে একটি গল্প বলো')">
      গল্প বলো
    </button>

  </div>



  <!-- BOTTOM -->

  <div class="bottom">

    <div class="input-row">

      <button
        class="icon-btn"
        id="micBtn"
        onclick="startListening()"
      >
        🎤
      </button>


      <input
        class="input"
        id="input"
        type="text"
        placeholder="ময়না পাখিকে কিছু বলো..."
        autocomplete="off"
      >


      <button
        class="send-btn"
        onclick="sendMessage()"
      >
        ➤
      </button>

    </div>


    <div class="controls">

      <button
        class="control"
        onclick="toggleVoice()"
        id="voiceBtn"
      >
        🔊 ভয়েস চালু
      </button>

      <button
        class="control"
        onclick="stopSpeaking()"
      >
        ⏹ থামাও
      </button>

      <button
        class="control"
        onclick="clearChat()"
      >
        🗑 পরিষ্কার
      </button>

    </div>

  </div>

</div>



<script>

/* =====================================================
   CONFIG
===================================================== */

const RENDER_URL =
  "https://jarvis-1-0yao.onrender.com";


/* =====================================================
   ELEMENTS
===================================================== */

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("input");

const girl =
  document.getElementById("girl");

const micBtn =
  document.getElementById("micBtn");

const voiceBtn =
  document.getElementById("voiceBtn");


/* =====================================================
   VOICE
===================================================== */

let voiceEnabled = true;

let speaking = false;


function cleanForSpeech(text){

  return text

    .replace(
      /[\u{1F300}-\u{1FAFF}]/gu,
      ""
    )

    .replace(
      /[*_#`~]/g,
      ""
    )

    .replace(
      /\s+/g,
      " "
    )

    .trim();
}


function speak(text){

  if(!voiceEnabled){
    return;
  }

  if(!("speechSynthesis" in window)){
    return;
  }

  speechSynthesis.cancel();

  const speechText =
    cleanForSpeech(text);

  if(!speechText){
    return;
  }

  const utterance =
    new SpeechSynthesisUtterance(
      speechText
    );

  utterance.lang = "bn-BD";

  utterance.rate = 0.92;

  utterance.pitch = 1.12;

  utterance.volume = 1;


  const voices =
    speechSynthesis.getVoices();


  const bengaliVoice =
    voices.find(
      v =>
        v.lang &&
        v.lang.toLowerCase()
        .startsWith("bn")
    );


  if(bengaliVoice){
    utterance.voice =
      bengaliVoice;
  }


  utterance.onstart = () => {

    speaking = true;

    girl.classList.add(
      "speaking"
    );

  };


  utterance.onend = () => {

    speaking = false;

    girl.classList.remove(
      "speaking"
    );

  };


  utterance.onerror = () => {

    speaking = false;

    girl.classList.remove(
      "speaking"
    );

  };


  speechSynthesis.speak(
    utterance
  );
}


function stopSpeaking(){

  if(
    "speechSynthesis"
    in window
  ){

    speechSynthesis.cancel();

  }

  speaking = false;

  girl.classList.remove(
    "speaking"
  );
}


function toggleVoice(){

  voiceEnabled =
    !voiceEnabled;


  if(!voiceEnabled){

    stopSpeaking();

    voiceBtn.textContent =
      "🔇 ভয়েস বন্ধ";

  }else{

    voiceBtn.textContent =
      "🔊 ভয়েস চালু";

  }
}


/* =====================================================
   CHAT
===================================================== */

function addMessage(
  text,
  type
){

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message " + type;


  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";

  bubble.textContent =
    text;


  message.appendChild(
    bubble
  );


  chat.appendChild(
    message
  );


  chat.scrollTop =
    chat.scrollHeight;
}


function addTyping(){

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message ai";

  message.id =
    "typingMessage";


  message.innerHTML = `
    <div class="bubble">
      <div class="typing">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  `;


  chat.appendChild(
    message
  );


  chat.scrollTop =
    chat.scrollHeight;
}


function removeTyping(){

  const element =
    document.getElementById(
      "typingMessage"
    );

  if(element){
    element.remove();
  }
}


/* =====================================================
   SEND TO GEMINI
===================================================== */

async function sendMessage(){

  const message =
    input.value.trim();


  if(!message){
    return;
  }


  input.value = "";


  addMessage(
    message,
    "user"
  );


  addTyping();


  try{

    const response =
      await fetch(
        RENDER_URL +
        "/api/ai",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message:message
            })
        }
      );


    const data =
      await response.json();


    removeTyping();


    if(!response.ok){

      throw new Error(
        data.error ||
        "AI উত্তর দিতে পারেনি"
      );

    }


    const answer =
      data.answer ||
      "দুঃখিত, কোনো উত্তর পাওয়া যায়নি।";


    addMessage(
      answer,
      "ai"
    );


    speak(answer);


  }catch(error){

    removeTyping();


    console.error(
      "AI Error:",
      error
    );


    addMessage(
      "দুঃখিত, AI-এর সাথে যোগাযোগ করা যাচ্ছে না। একটু পরে আবার চেষ্টা করো।",
      "ai"
    );

  }

}


/* =====================================================
   QUICK ASK
===================================================== */

function quickAsk(text){

  input.value =
    text;

  sendMessage();

}


/* =====================================================
   ENTER KEY
===================================================== */

input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter"
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =====================================================
   SPEECH RECOGNITION
===================================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


let recognition = null;

let listening = false;


if(SpeechRecognition){

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "bn-BD";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;


  recognition.onstart = () => {

    listening = true;

    micBtn.textContent =
      "🔴";

  };


  recognition.onresult =
    event => {

      const transcript =
        event
          .results[0][0]
          .transcript;


      input.value =
        transcript;


      listening = false;

      micBtn.textContent =
        "🎤";


      sendMessage();

    };


  recognition.onerror =
    error => {

      console.error(
        "Speech error:",
        error
      );

      listening = false;

      micBtn.textContent =
        "🎤";

    };


  recognition.onend =
    () => {

      listening = false;

      micBtn.textContent =
        "🎤";

    };

}


function startListening(){

  if(!recognition){

    alert(
      "এই ব্রাউজারে বাংলা voice recognition সাপোর্ট নেই। Chrome ব্যবহার করে দেখো।"
    );

    return;
  }


  if(listening){

    recognition.stop();

    return;

  }


  try{

    recognition.start();

  }catch(error){

    console.error(error);

  }

}


/* =====================================================
   CLEAR CHAT
===================================================== */

function clearChat(){

  chat.innerHTML = "";

  addMessage(
    "চ্যাট পরিষ্কার হয়েছে। আবার আমাকে কিছু জিজ্ঞেস করো। ❤️",
    "ai"
  );

}


/* =====================================================
   LOAD VOICES
===================================================== */

if(
  "speechSynthesis"
  in window
){

  speechSynthesis.onvoiceschanged =
    () => {

      speechSynthesis
        .getVoices();

    };

}


/* =====================================================
   START
===================================================== */

console.log(
  "Moyna Pakhi Gemini frontend loaded"
);

</script>


</body>
</html>
