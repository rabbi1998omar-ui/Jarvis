<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#10081d">

<title>ময়না পাখি AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  color:white;
  font-family:
    system-ui,
    "Noto Sans Bengali",
    sans-serif;

  background:
    radial-gradient(
      circle at 50% 18%,
      #7c4d9d 0%,
      transparent 31%
    ),
    radial-gradient(
      circle at 10% 80%,
      #3b2161 0%,
      transparent 35%
    ),
    linear-gradient(
      145deg,
      #07050d,
      #170b27,
      #090611
    );
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(255,120,220,.08),

}

/* =========================
   APP
========================= */

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:16px 15px 24px;
  display:flex;
  flex-direction:column;
}

/* =========================
   HEADER
========================= */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brandIcon{
  width:45px;
  height:45px;
  border-radius:15px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:24px;

  background:
    linear-gradient(
      135deg,
      #ff67bd,
      #7857ff
    );

  box-shadow:
    0 8px 30px
    rgba(205,70,255,.35);
}

.brandText h1{
  font-size:20px;
  font-weight:800;
}

.brandText p{
  color:#c9b9d5;
  font-size:11px;
  margin-top:2px;
}

.online{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  color:#bdb0c7;
}

.onlineDot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#4dff9b;

  box-shadow:
    0 0 13px #4dff9b;
}

/* =========================
   GIRL AREA
========================= */

.girlArea{
  position:relative;
  height:350px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-top:5px;
}

.glow{
  position:absolute;

  width:280px;
  height:280px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(238,102,255,.38),
      rgba(118,83,255,.12),
      transparent 70%
    );

  filter:blur(6px);

  animation:
    glowMove 4s ease-in-out infinite;
}

@keyframes glowMove{

  0%,100%{
    transform:scale(.95);
    opacity:.75;
  }

  50%{
    transform:scale(1.08);
    opacity:1;
  }

}

/* =========================
   GIRL
========================= */

.girl{
  position:relative;

  width:230px;
  height:310px;

  z-index:2;

  animation:
    girlFloat 3.5s ease-in-out infinite;
}

@keyframes girlFloat{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-6px);
  }

}

/* =========================
   HAIR BACK
========================= */

.hairBack{
  position:absolute;

  width:170px;
  height:215px;

  left:30px;
  top:15px;

  border-radius:
    85px
    85px
    70px
    70px;

  background:
    linear-gradient(
      120deg,
      #140c1c,
      #382047,
      #171020
    );

  box-shadow:
    0 15px 35px
    rgba(0,0,0,.55);
}

/* hair shine */

.hairShine{
  position:absolute;

  width:40px;
  height:125px;

  left:48px;
  top:34px;

  border-radius:50%;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.11),
      transparent
    );

  transform:rotate(18deg);

  filter:blur(2px);
}

/* =========================
   NECK
========================= */

.neck{
  position:absolute;

  width:46px;
  height:55px;

  left:92px;
  top:190px;

  background:#e9b19f;

  z-index:2;
}

/* =========================
   BODY
========================= */

.body{
  position:absolute;

  width:165px;
  height:105px;

  left:33px;
  top:205px;

  border-radius:
    70px
    70px
    25px
    25px;

  background:
    linear-gradient(
      135deg,
      #bd55df,
      #6549d9
    );

  box-shadow:
    0 20px 40px
    rgba(0,0,0,.4);

  z-index:3;
}

.body::before{
  content:"";

  position:absolute;

  width:80px;
  height:35px;

  top:10px;
  left:43px;

  border-radius:50%;

  background:
    rgba(255,255,255,.08);
}

/* =========================
   FACE
========================= */

.face{
  position:absolute;

  width:119px;
  height:148px;

  left:56px;
  top:50px;

  border-radius:
    54%
    54%
    48%
    48%;

  background:
    linear-gradient(
      145deg,
      #ffe6d7,
      #f0b9a8
    );

  z-index:4;

  box-shadow:
    0 8px 20px
    rgba(0,0,0,.25);
}

/* =========================
   BANGS
========================= */

.bangs{
  position:absolute;

  width:118px;
  height:75px;

  left:56px;
  top:37px;

  background:#25132f;

  border-radius:
    65%
    55%
    45%
    35%;

  transform:rotate(-4deg);

  z-index:7;
}

.bangs::after{
  content:"";

  position:absolute;

  width:55px;
  height:80px;

  right:-7px;
  top:18px;

  background:#25132f;

  border-radius:50%;

  transform:rotate(-18deg);
}

/* =========================
   EARS
========================= */

.ear{
  position:absolute;

  width:14px;
  height:28px;

  top:108px;

  background:#efb8a7;

  border-radius:50%;

  z-index:3;
}

.ear.left{
  left:48px;
}

.ear.right{
  left:169px;
}

/* =========================
   EYES
========================= */

.eye{
  position:absolute;

  width:19px;
  height:13px;

  top:111px;

  background:#24142b;

  border-radius:50%;

  z-index:9;

  transform-origin:center;
}

.eye.left{
  left:78px;
}

.eye.right{
  left:127px;
}

.eye::before{
  content:"";

  position:absolute;

  width:5px;
  height:5px;

  left:3px;
  top:2px;

  border-radius:50%;

  background:white;
}

/* blinking */

.blink .eye{
  transform:scaleY(.08);
}

/* =========================
   EYEBROWS
========================= */

.brow{
  position:absolute;

  width:23px;
  height:5px;

  top:102px;

  border-top:
    2px solid
    #6e4053;

  border-radius:50%;

  z-index:10;
}

.brow.left{
  left:76px;
  transform:rotate(-5deg);
}

.brow.right{
  left:126px;
  transform:rotate(5deg);
}

/* =========================
   NOSE
========================= */

.nose{
  position:absolute;

  width:5px;
  height:12px;

  left:115px;
  top:125px;

  border-right:
    2px solid
    rgba(150,90,80,.45);

  z-index:10;
}

/* =========================
   CHEEKS
========================= */

.cheek{
  position:absolute;

  width:23px;
  height:12px;

  top:139px;

  border-radius:50%;

  background:
    rgba(245,105,140,.18);

  filter:blur(2px);

  z-index:8;
}

.cheek.left{
  left:69px;
}

.cheek.right{
  left:135px;
}

/* =========================
   MOUTH
========================= */

.mouth{
  position:absolute;

  width:27px;
  height:9px;

  left:102px;
  top:157px;

  border-bottom:
    3px solid
    #bd5876;

  border-radius:
    0 0 50% 50%;

  z-index:10;

  transition:
    all .08s ease;
}

/* talking mouth */

.talking .mouth{
  width:27px;
  height:17px;

  background:#76294d;

  border:
    3px solid
    #b94d70;

  border-radius:50%;

  animation:
    mouthTalk .13s infinite alternate;
}

@keyframes mouthTalk{

  from{
    transform:scaleY(.6);
  }

  to{
    transform:scaleY(1.15);
  }

}

/* talking face */

.talking .girl{
  animation:
    talkFloat .45s ease-in-out infinite alternate;
}

@keyframes talkFloat{

  from{
    transform:translateY(0);
  }

  to{
    transform:translateY(-2px);
  }

}

/* =========================
   STATUS
========================= */

.greeting{
  position:absolute;

  bottom:0;

  width:100%;

  text-align:center;

  z-index:5;
}

.greeting h2{
  font-size:22px;
  font-weight:800;
}

.greeting p{
  color:#c7b8d2;
  font-size:13px;
  margin-top:5px;
}

/* =========================
   CHAT
========================= */

.chat{
  height:205px;

  overflow-y:auto;

  padding:3px;

  scrollbar-width:none;
}

.chat::-webkit-scrollbar{
  display:none;
}

.message{
  max-width:88%;

  padding:11px 14px;

  margin:8px 0;

  border-radius:18px;

  font-size:14px;

  line-height:1.55;

  animation:
    messageIn .25s ease;
}

@keyframes messageIn{

  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

.message.ai{
  margin-right:auto;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.08);
}

.message.user{
  margin-left:auto;

  background:
    linear-gradient(
      135deg,
      #c64de6,
      #7057ed
    );
}

/* =========================
   QUICK BUTTONS
========================= */

.quick{
  display:flex;

  gap:8px;

  overflow-x:auto;

  margin-top:8px;

  scrollbar-width:none;
}

.quick::-webkit-scrollbar{
  display:none;
}

.quick button{
  flex:0 0 auto;

  padding:9px 13px;

  border:
    1px solid
    rgba(255,255,255,.1);

  border-radius:13px;

  background:
    rgba(255,255,255,.06);

  color:white;

  font-size:11px;
}

/* =========================
   INPUT
========================= */

.inputArea{
  display:flex;

  gap:8px;

  margin-top:10px;
}

.inputBox{
  flex:1;

  height:51px;

  display:flex;

  align-items:center;

  padding:0 14px;

  border-radius:17px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.1);
}

.inputBox input{
  width:100%;

  border:none;

  outline:none;

  background:none;

  color:white;

  font-size:14px;
}

.inputBox input::placeholder{
  color:#9d91a7;
}

.send{
  width:52px;
  height:52px;

  border:none;

  border-radius:17px;

  color:white;

  font-size:21px;

  background:
    linear-gradient(
      135deg,
      #ef58b9,
      #7159ff
    );
}

/* =========================
   MIC
========================= */

.micArea{
  display:flex;

  justify-content:center;

  margin-top:11px;
}

.mic{
  width:67px;
  height:67px;

  border:none;

  border-radius:50%;

  color:white;

  font-size:27px;

  background:
    linear-gradient(
      135deg,
      #ed60bd,
      #7359ff
    );

  box-shadow:
    0 10px 30px
    rgba(195,67,240,.35);
}

.listening .mic{
  animation:
    micPulse 1s infinite;
}

@keyframes micPulse{

  0%{
    box-shadow:
      0 0 0 0
      rgba(239,91,190,.65);
  }

  70%{
    box-shadow:
      0 0 0 22px
      rgba(239,91,190,0);
  }

  100%{
    box-shadow:
      0 0 0 0
      rgba(239,91,190,0);
  }

}

/* =========================
   CONTROLS
========================= */

.controls{
  display:flex;

  justify-content:center;

  gap:7px;

  margin-top:10px;

  flex-wrap:wrap;
}

.control{
  border:
    1px solid
    rgba(255,255,255,.1);

  background:
    rgba(255,255,255,.06);

  color:#d7cadf;

  border-radius:11px;

  padding:8px 11px;

  font-size:11px;
}

/* =========================
   LOADING
========================= */

.loading{
  display:flex;

  gap:5px;
}

.loading span{
  width:5px;
  height:5px;

  border-radius:50%;

  background:#d786ff;

  animation:
    loadingDot 1s infinite;
}

.loading span:nth-child(2){
  animation-delay:.15s;
}

.loading span:nth-child(3){
  animation-delay:.3s;
}

@keyframes loadingDot{

  0%,100%{
    opacity:.2;
    transform:translateY(0);
  }

  50%{
    opacity:1;
    transform:translateY(-4px);
  }

}

/* =========================
   FOOTER
========================= */

.footer{
  text-align:center;

  color:#786c82;

  font-size:9px;

  margin-top:10px;
}
</style>
</head>


<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <div class="brand">

      <div class="brandIcon">
        🐦
      </div>

      <div class="brandText">

        <h1>ময়না পাখি</h1>

        <p>
          তোমার AI ভয়েস সহকারী
        </p>

      </div>

    </div>


    <div class="online">

      <span class="onlineDot"></span>

      অনলাইন

    </div>

  </div>


  <!-- GIRL -->

  <div class="girlArea">

    <div class="glow"></div>


    <div
      class="girl"
      id="girl"
    >

      <div class="hairBack">

        <div class="hairShine"></div>

      </div>


      <div class="neck"></div>


      <div class="body"></div>


      <div class="face"></div>


      <div class="bangs"></div>


      <div class="ear left"></div>
      <div class="ear right"></div>


      <div class="brow left"></div>
      <div class="brow right"></div>


      <div class="eye left"></div>
      <div class="eye right"></div>


      <div class="nose"></div>


      <div class="cheek left"></div>
      <div class="cheek right"></div>


      <div class="mouth"></div>

    </div>


    <div class="greeting">

      <h2>
        হ্যালো! আমি ময়না 🩷
      </h2>

      <p id="statusText">
        আমার সাথে কথা বলো...
      </p>

    </div>

  </div>


  <!-- CHAT -->

  <div
    class="chat"
    id="chat"
  >

    <div class="message ai">

      হ্যালো! আমি ময়না পাখি। 🩷
      আমাকে যেকোনো প্রশ্ন করতে পারো।

    </div>

  </div>


  <!-- QUICK -->

  <div class="quick">

    <button
      onclick="quickAsk('আজকের তারিখ কত?')"
    >
      📅 তারিখ
    </button>

    <button
      onclick="quickAsk('এখন কয়টা বাজে?')"
    >
      🕐 সময়
    </button>

    <button
      onclick="quickAsk('তুমি কী কী করতে পারো?')"
    >
      🤖 কী পারো
    </button>

    <button
      onclick="quickAsk('একটা মজার কথা বলো')"
    >
      😄 মজা
    </button>

  </div>


  <!-- INPUT -->

  <div class="inputArea">

    <div class="inputBox">

      <input
        id="textInput"
        type="text"
        placeholder="ময়নাকে কিছু বলো..."
        autocomplete="off"
      >

    </div>


    <button
      class="send"
      onclick="sendText()"
    >
      ➤
    </button>

  </div>


  <!-- MIC -->

  <div class="micArea">

    <button
      class="mic"
      id="micBtn"
      onclick="startListening()"
    >
      🎙️
    </button>

  </div>


  <!-- CONTROLS -->

  <div class="controls">

    <button
      class="control"
      id="voiceBtn"
      onclick="toggleVoice()"
    >
      🔊 ভয়েস চালু
    </button>


    <button
      class="control"
      onclick="stopSpeaking()"
    >
      ⏹️ থামাও
    </button>


    <button
      class="control"
      onclick="clearChat()"
    >
      🗑️ পরিষ্কার
    </button>

  </div>


  <div class="footer">

    Moyna Pakhi AI • Powered by AI

  </div>

</div>


<script>

/* =========================================
   SERVER
========================================= */

const RENDER_URL =
  "https://jarvis-1-0yao.onrender.com";


/* =========================================
   VARIABLES
========================================= */

let voiceEnabled = true;

let recognition = null;

let listening = false;

let blinkTimer = null;


/* =========================================
   ELEMENTS
========================================= */

const girl =
  document.getElementById("girl");

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("textInput");

const statusText =
  document.getElementById("statusText");

const micBtn =
  document.getElementById("micBtn");


/* =========================================
   RANDOM BLINK
========================================= */

function startBlinking(){

  if(blinkTimer)
    clearInterval(blinkTimer);

  blinkTimer =
    setInterval(() => {

      if(
        !girl.classList.contains("talking")
      ){

        girl.classList.add("blink");

        setTimeout(() => {

          girl.classList.remove("blink");

        },130);

      }

    },
    3500 +
    Math.random()*2500
    );

}

startBlinking();


/* =========================================
   CHAT MESSAGE
========================================= */

function addMessage(
  text,
  type
){

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  div.textContent =
    text;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================================
   CLEAN SPEECH
========================================= */

function cleanForSpeech(text){

  return text

    .replace(
      /[\u{1F000}-\u{1FAFF}]/gu,
      ""
    )

    .replace(
      /[\u{2600}-\u{27BF}]/gu,
      ""
    )

    .replace(
      /\s+/g,
      " "
    )

    .trim();

}


/* =========================================
   BANGLA VOICE
========================================= */

function getBanglaVoice(){

  const voices =
    speechSynthesis.getVoices();

  return (

    voices.find(
      v => v.lang === "bn-BD"
    )

    ||

    voices.find(
      v => v.lang === "bn-IN"
    )

    ||

    voices.find(
      v =>
        v.lang &&
        v.lang
         .toLowerCase()
         .startsWith("bn")
    )

    ||

    null

  );

}


/* =========================================
   SPEAK
========================================= */

function speak(text){

  if(!voiceEnabled)
    return;

  if(
    !("speechSynthesis" in window)
  )
    return;


  speechSynthesis.cancel();


  const clean =
    cleanForSpeech(text);


  if(!clean)
    return;


  const utter =
    new SpeechSynthesisUtterance(
      clean
    );


  const voice =
    getBanglaVoice();


  if(voice)
    utter.voice = voice;


  utter.lang =
    voice?.lang || "bn-BD";


  /*
    মিষ্টি ও ধীর voice
  */

  utter.rate =
    0.86;

  utter.pitch =
    1.14;

  utter.volume =
    1;


  utter.onstart =
    () => {

      girl.classList.add(
        "talking"
      );

      statusText.textContent =
        "আমি কথা বলছি... 🩷";

    };


  utter.onend =
    () => {

      girl.classList.remove(
        "talking"
      );

      statusText.textContent =
        "আর কিছু বলবে?";

    };


  utter.onerror =
    () => {

      girl.classList.remove(
        "talking"
      );

      statusText.textContent =
        "আবার চেষ্টা করো...";

    };


  speechSynthesis.speak(
    utter
  );

}


/* =========================================
   STOP
========================================= */

function stopSpeaking(){

  if(
    "speechSynthesis"
    in window
  ){

    speechSynthesis.cancel();

  }


  girl.classList.remove(
    "talking"
  );


  statusText.textContent =
    "আমি শুনছি...";

}


/* =========================================
   VOICE BUTTON
========================================= */

function toggleVoice(){

  voiceEnabled =
    !voiceEnabled;


  const btn =
    document.getElementById(
      "voiceBtn"
    );


  if(voiceEnabled){

    btn.textContent =
      "🔊 ভয়েস চালু";

  }else{

    speechSynthesis.cancel();

    girl.classList.remove(
      "talking"
    );

    btn.textContent =
      "🔇 ভয়েস বন্ধ";

  }

}


/* =========================================
   LOADING
========================================= */

function showLoading(){

  const div =
    document.createElement(
      "div"
    );

  div.id =
    "loadingMessage";

  div.className =
    "message ai";


  div.innerHTML = `
    <div class="loading">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;


  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

}


function removeLoading(){

  const loading =
    document.getElementById(
      "loadingMessage"
    );

  if(loading)
    loading.remove();

}


/* =========================================
   AI
========================================= */

async function askAI(message){

  if(!message)
    return;


  addMessage(
    message,
    "user"
  );


  statusText.textContent =
    "ভাবছি... 🤔";


  showLoading();


  try{

    const response =
      await fetch(
        RENDER_URL +
        "/api/ai",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message:
                message
            })
        }
      );


    const data =
      await response.json();


    removeLoading();


    if(!response.ok){

      throw new Error(
        data.error ||
        "AI error"
      );

    }


    const answer =
      data.answer ||
      "দুঃখিত, কোনো উত্তর পাওয়া যায়নি।";


    addMessage(
      answer,
      "ai"
    );


    speak(answer);


  }catch(error){

    console.error(error);


    removeLoading();


    const msg =
      "দুঃখিত, AI-এর সাথে যোগাযোগ করা যাচ্ছে না। একটু পরে আবার চেষ্টা করো।";


    addMessage(
      msg,
      "ai"
    );


    speak(msg);


    statusText.textContent =
      "সংযোগে সমস্যা হয়েছে";

  }

}


/* =========================================
   TEXT SEND
========================================= */

function sendText(){

  const text =
    input.value.trim();


  if(!text)
    return;


  input.value = "";


  askAI(text);

}


/* =========================================
   QUICK
========================================= */

function quickAsk(text){

  askAI(text);

}


/* =========================================
   ENTER
========================================= */

input.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter"
    ){

      event.preventDefault();

      sendText();

    }

  }
);


/* =========================================
   SPEECH RECOGNITION
========================================= */

function setupRecognition(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    micBtn.disabled =
      true;

    micBtn.textContent =
      "❌";

    statusText.textContent =
      "এই ব্রাউজারে voice input নেই";

    return;

  }


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "bn-BD";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    1;


  recognition.onstart =
    () => {

      listening = true;


      document.body.classList.add(
        "listening"
      );


      micBtn.textContent =
        "⏹️";


      statusText.textContent =
        "আমি শুনছি... বলো 🩷";

    };


  recognition.onresult =
    event => {

      const text =
        event
          .results[0][0]
          .transcript;


      input.value =
        text;


      askAI(text);

    };


  recognition.onerror =
    event => {

      console.log(
        "Speech error:",
        event.error
      );


      statusText.textContent =
        "ঠিকমতো শুনতে পারিনি";

    };


  recognition.onend =
    () => {

      listening = false;


      document.body.classList.remove(
        "listening"
      );


      micBtn.textContent =
        "🎙️";

    };

}


/* =========================================
   START LISTENING
========================================= */

function startListening(){

  if(!recognition)
    setupRecognition();


  if(!recognition)
    return;


  if(listening){

    recognition.stop();

    return;

  }


  try{

    recognition.start();

  }catch(error){

    console.log(error);

  }

}


/* =========================================
   LOAD VOICES
========================================= */

if(
  "speechSynthesis"
  in window
){

  speechSynthesis.onvoiceschanged =
    () => {

      speechSynthesis.getVoices();

    };

}


/* =========================================
   START APP
========================================= */

setupRecognition();

</script>
