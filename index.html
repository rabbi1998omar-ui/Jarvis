<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#07111f">

<title>ময়না পাখি 🐦</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:
    "Noto Sans Bengali",
    "Noto Sans",
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at top,
      #12335a 0%,
      #07111f 42%,
      #03070d 100%
    );

  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
}

/* =========================
   APP
========================= */

.app{
  width:100%;
  max-width:600px;
  min-height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* =========================
   HEADER
========================= */

.header{
  padding:18px 18px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;

  background:
    rgba(5,15,28,.72);

  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(100,190,255,.12);

  position:sticky;
  top:0;
  z-index:20;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:27px;

  background:
    linear-gradient(
      135deg,
      #38bdf8,
      #2563eb,
      #7c3aed
    );

  box-shadow:
    0 0 25px rgba(56,189,248,.35);
}

.title{
  font-size:20px;
  font-weight:700;
}

.subtitle{
  font-size:12px;
  color:#8bd8ff;
  margin-top:3px;
}

.online{
  display:flex;
  align-items:center;
  gap:6px;

  font-size:12px;
  color:#8fffc1;
}

.online-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#35e887;

  box-shadow:
    0 0 12px #35e887;
}

/* =========================
   AI AREA
========================= */

.ai-area{
  padding:24px 15px 10px;
  text-align:center;
}

.girl-wrap{
  width:210px;
  height:210px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;
}

/* outer glow */

.girl-wrap::before{
  content:"";

  position:absolute;

  width:190px;
  height:190px;

  border-radius:50%;

  border:1px solid
    rgba(75,190,255,.25);

  box-shadow:
    0 0 30px rgba(0,160,255,.16),
    inset 0 0 30px rgba(80,150,255,.08);

  animation:
    rotateRing 12s linear infinite;
}

.girl-wrap::after{
  content:"";

  position:absolute;

  width:155px;
  height:155px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(56,189,248,.20),
      transparent 68%
    );

  filter:blur(8px);

  animation:
    pulseGlow 2.5s ease-in-out infinite;
}

@keyframes rotateRing{
  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }
}

@keyframes pulseGlow{
  0%,100%{
    transform:scale(.92);
    opacity:.6;
  }

  50%{
    transform:scale(1.08);
    opacity:1;
  }
}

/* =========================
   GIRL
========================= */

.girl{
  width:135px;
  height:135px;

  border-radius:50%;

  position:relative;
  z-index:3;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:72px;

  background:
    linear-gradient(
      145deg,
      #152d4a,
      #07111f
    );

  border:2px solid
    rgba(110,210,255,.35);

  box-shadow:
    0 0 35px rgba(0,180,255,.22);

  transition:.3s;
}

.girl.speaking{
  animation:
    speakingPulse .75s ease-in-out infinite;
}

@keyframes speakingPulse{

  0%,100%{
    transform:scale(1);
    box-shadow:
      0 0 30px rgba(0,180,255,.25);
  }

  50%{
    transform:scale(1.06);
    box-shadow:
      0 0 55px rgba(0,210,255,.55);
  }

}

.ai-name{
  font-size:25px;
  font-weight:700;
  margin-top:7px;

  background:
    linear-gradient(
      90deg,
      #7dd3fc,
      #a78bfa
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.ai-status{
  min-height:23px;
  margin-top:7px;

  font-size:13px;
  color:#8eb7d5;
}

.ai-status.active{
  color:#7dd3fc;
}

/* =========================
   THINKING DOTS
========================= */

.thinking{
  display:none;
  justify-content:center;
  align-items:center;
  gap:5px;
  margin-top:7px;
}

.thinking.show{
  display:flex;
}

.thinking span{
  width:7px;
  height:7px;
  border-radius:50%;

  background:#55cfff;

  animation:
    thinking 1.2s infinite;
}

.thinking span:nth-child(2){
  animation-delay:.15s;
}

.thinking span:nth-child(3){
  animation-delay:.30s;
}

@keyframes thinking{

  0%,60%,100%{
    transform:translateY(0);
    opacity:.4;
  }

  30%{
    transform:translateY(-6px);
    opacity:1;
  }

}

/* =========================
   CHAT
========================= */

.chat{
  flex:1;

  padding:
    10px
    15px
    160px;

  display:flex;
  flex-direction:column;
  gap:10px;
}

.message{
  max-width:85%;
  padding:12px 15px;

  border-radius:18px;

  line-height:1.55;
  font-size:15px;

  word-break:break-word;

  animation:
    messageIn .25s ease;
}

@keyframes messageIn{

  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

.message.ai{
  align-self:flex-start;

  background:
    rgba(20,50,75,.75);

  border:
    1px solid
    rgba(90,190,255,.14);

  border-bottom-left-radius:5px;
}

.message.user{
  align-self:flex-end;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #7c3aed
    );

  border-bottom-right-radius:5px;
}

.time{
  display:block;
  margin-top:5px;

  font-size:9px;
  opacity:.55;
}

/* =========================
   QUICK BUTTONS
========================= */

.quick{
  display:flex;
  gap:8px;

  overflow-x:auto;

  padding:
    8px
    15px
    5px;

  scrollbar-width:none;
}

.quick::-webkit-scrollbar{
  display:none;
}

.quick button{
  flex-shrink:0;

  border:1px solid
    rgba(100,200,255,.18);

  background:
    rgba(15,35,55,.75);

  color:#c9edff;

  padding:9px 13px;

  border-radius:20px;

  font-size:12px;

  cursor:pointer;
}

/* =========================
   BOTTOM
========================= */

.bottom{
  position:fixed;

  bottom:0;
  left:50%;

  transform:translateX(-50%);

  width:100%;
  max-width:600px;

  padding:
    10px
    12px
    14px;

  background:
    linear-gradient(
      to top,
      rgba(3,7,13,.98),
      rgba(3,7,13,.92),
      rgba(3,7,13,.75)
    );

  backdrop-filter:blur(18px);

  z-index:30;
}

.input-row{
  display:flex;
  align-items:flex-end;
  gap:8px;
}

.input-box{
  flex:1;

  display:flex;
  align-items:flex-end;

  background:
    rgba(18,36,56,.9);

  border:
    1px solid
    rgba(100,200,255,.18);

  border-radius:22px;

  padding:6px 7px 6px 15px;
}

#messageInput{
  flex:1;

  min-width:0;

  resize:none;

  max-height:100px;

  border:0;
  outline:0;

  background:transparent;

  color:#fff;

  font-family:inherit;
  font-size:14px;

  padding:8px 4px;
}

#messageInput::placeholder{
  color:#7090a8;
}

.icon-btn{
  width:42px;
  height:42px;

  border:0;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    rgba(45,75,105,.75);

  color:#d9f5ff;

  font-size:19px;

  cursor:pointer;
}

.icon-btn.active{
  background:
    linear-gradient(
      135deg,
      #06b6d4,
      #2563eb
    );

  box-shadow:
    0 0 18px rgba(0,180,255,.35);
}

.send-btn{
  width:49px;
  height:49px;

  flex-shrink:0;

  border:0;
  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      #06b6d4,
      #2563eb,
      #7c3aed
    );

  color:#fff;

  font-size:20px;

  box-shadow:
    0 5px 25px
    rgba(37,99,235,.35);

  cursor:pointer;
}

.control-row{
  display:flex;
  justify-content:center;
  gap:9px;

  margin-top:8px;
}

.control{
  border:0;

  background:transparent;

  color:#718ba0;

  font-size:11px;

  padding:4px 9px;

  cursor:pointer;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:380px){

  .girl-wrap{
    width:180px;
    height:180px;
  }

  .girl-wrap::before{
    width:165px;
    height:165px;
  }

  .girl{
    width:120px;
    height:120px;
    font-size:62px;
  }

  .chat{
    padding-bottom:155px;
  }

}

</style>
</head>


<body>

<div class="app">

<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="logo-area">

    <div class="logo">
      🐦
    </div>

    <div>

      <div class="title">
        ময়না পাখি
      </div>

      <div class="subtitle">
        তোমার বাংলা AI সহকারী
      </div>

    </div>

  </div>


  <div class="online">

    <span class="online-dot"></span>

    Online

  </div>

</header>


<!-- =========================
     AI
========================= -->

<section class="ai-area">

  <div class="girl-wrap">

    <div
      class="girl"
      id="girl">

      👩🏻‍💼

    </div>

  </div>


  <div class="ai-name">
    ময়না পাখি
  </div>


  <div
    class="ai-status"
    id="aiStatus">

  </div>


  <div
    class="thinking"
    id="thinking">

    <span></span>
    <span></span>
    <span></span>

  </div>

</section>


<!-- =========================
     CHAT
========================= -->

<main
  class="chat"
  id="chat">

  <div
    class="message ai">

    হ্যালো! আমি ময়না পাখি 🐦
    <br>
    তুমি আমার সাথে বাংলায় কথা বলতে পারো।

    <span class="time">
      এখন
    </span>

  </div>

</main>


<!-- =========================
     QUICK
========================= -->

<div class="quick">

  <button
    onclick="quickAsk('আজকের দিনটি কেমন হতে পারে?')">

    🌤️ আজকের দিন

  </button>

  <button
    onclick="quickAsk('আমাকে একটি সুন্দর কথা বলো')">

    💙 সুন্দর কথা

  </button>

  <button
    onclick="quickAsk('তুমি কী কী করতে পারো?')">

    🤖 কী করতে পারো?

  </button>

  <button
    onclick="quickAsk('একটি মজার গল্প বলো')">

    📖 গল্প

  </button>

</div>


<!-- =========================
     BOTTOM
========================= -->

<div class="bottom">

  <div class="input-row">

    <div class="input-box">

      <textarea
        id="messageInput"
        rows="1"
        placeholder="ময়না পাখিকে কিছু বলো..."
      ></textarea>


      <button
        class="icon-btn active"
        id="voiceBtn"
        title="Voice">

        🎙️

      </button>

    </div>


    <button
      class="send-btn"
      id="sendBtn"
      title="Send">

      ➤

    </button>

  </div>


  <div class="control-row">

    <button
      class="control"
      id="stopBtn">

      ⏹️ কথা থামাও

    </button>


    <button
      class="control"
      id="clearBtn">

      🗑️ চ্যাট পরিষ্কার

    </button>

  </div>

</div>

</div>


<script>

/* =========================================
   RENDER SERVER
========================================= */

const RENDER_URL =
  "https://jarvis-1-0yao.onrender.com";


/* =========================================
   ELEMENTS
========================================= */

const chat =
  document.getElementById("chat");

const messageInput =
  document.getElementById(
    "messageInput"
  );

const sendBtn =
  document.getElementById(
    "sendBtn"
  );

const voiceBtn =
  document.getElementById(
    "voiceBtn"
  );

const stopBtn =
  document.getElementById(
    "stopBtn"
  );

const clearBtn =
  document.getElementById(
    "clearBtn"
  );

const girl =
  document.getElementById(
    "girl"
  );

const aiStatus =
  document.getElementById(
    "aiStatus"
  );

const thinking =
  document.getElementById(
    "thinking"
  );


/* =========================================
   SETTINGS
========================================= */

let voiceEnabled = true;

let speaking = false;

let recognition = null;


/* =========================================
   TIME
========================================= */

function getTime(){

  const now =
    new Date();

  return now.toLocaleTimeString(
    "bn-BD",
    {
      hour:"numeric",
      minute:"2-digit"
    }
  );

}


/* =========================================
   CLEAN TEXT FOR VOICE
========================================= */

function cleanForSpeech(text){

  return String(text)

    /* emoji remove */

    .replace(
      /[\u{1F000}-\u{1FAFF}]/gu,
      ""
    )

    .replace(
      /[\u{2600}-\u{27BF}]/g,
      ""
    )

    /* markdown */

    .replace(
      /[*_`#>]/g,
      ""
    )

    /* extra spaces */

    .replace(
      /\s+/g,
      " "
    )

    .trim();

}


/* =========================================
   ADD MESSAGE
========================================= */

function addMessage(
  text,
  type
){

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message " + type;

  const time =
    getTime();

  div.innerHTML =
    escapeHTML(text)
      .replace(
        /\n/g,
        "<br>"
      )
    +
    `<span class="time">
      ${time}
    </span>`;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(text){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================
   THINKING
========================================= */

function showThinking(){

  thinking.classList.add(
    "show"
  );

  aiStatus.textContent =
    "ময়না পাখি ভাবছে...";

  aiStatus.classList.add(
    "active"
  );

}


function hideThinking(){

  thinking.classList.remove(
    "show"
  );

}


/* =========================================
   FEMALE BENGALI VOICE
========================================= */

function speak(text){

  if(!voiceEnabled){

    return;

  }


  if(
    !("speechSynthesis"
      in window)
  ){

    return;

  }


  speechSynthesis.cancel();


  const speechText =
    cleanForSpeech(text);


  if(!speechText){

    return;

  }


  const utterance =
    new SpeechSynthesisUtterance(
      speechText
    );


  /* Bengali */

  utterance.lang =
    "bn-BD";


  /*
    একটু নরম ও মেয়েলি
    শোনানোর জন্য
  */

  utterance.rate =
    0.90;

  utterance.pitch =
    1.20;

  utterance.volume =
    1;


  const voices =
    speechSynthesis
      .getVoices();


  /*
    Female Bengali voice
    খোঁজা হবে
  */

  const femaleVoice =
    voices.find(v => {

      const name =
        (v.name || "")
          .toLowerCase();

      const lang =
        (v.lang || "")
          .toLowerCase();


      const isBangla =
        lang.startsWith(
          "bn"
        );


      const looksFemale =

        name.includes(
          "female"
        ) ||

        name.includes(
          "woman"
        ) ||

        name.includes(
          "google bengali female"
        ) ||

        name.includes(
          "bengali female"
        ) ||

        name.includes(
          "bangla female"
        ) ||

        name.includes(
          "female voice"
        );


      return (
        isBangla &&
        looksFemale
      );

    });


  /*
    Female না পেলে
    যেকোনো Bengali voice
  */

  const bengaliVoice =
    voices.find(v =>

      (v.lang || "")
        .toLowerCase()
        .startsWith("bn")

    );


  if(femaleVoice){

    utterance.voice =
      femaleVoice;

    console.log(
      "Female Bengali voice:",
      femaleVoice.name
    );

  }

  else if(bengaliVoice){

    utterance.voice =
      bengaliVoice;

    console.log(
      "Bengali voice:",
      bengaliVoice.name
    );

  }

  else{

    console.log(
      "বাংলা voice পাওয়া যায়নি"
    );

  }


  /* =====================
     SPEAK START
  ===================== */

  utterance.onstart = () => {

    speaking = true;


    girl.classList.add(
      "speaking"
    );


    aiStatus.classList.add(
      "active"
    );


    aiStatus.textContent =
      "ময়না পাখি কথা বলছে...";

  };


  /* =====================
     SPEAK END
  ===================== */

  utterance.onend = () => {

    speaking = false;


    girl.classList.remove(
      "speaking"
    );


    aiStatus.classList.remove(
      "active"
    );


    aiStatus.innerHTML =
      "";

  };


  /* =====================
     SPEAK ERROR
  ===================== */

  utterance.onerror = () => {

    speaking = false;


    girl.classList.remove(
      "speaking"
    );


    aiStatus.classList.remove(
      "active"
    );


    aiStatus.innerHTML =
      "";

  };


  speechSynthesis.speak(
    utterance
  );

}


/* =========================================
   LOAD VOICES
========================================= */

if(
  "speechSynthesis"
  in window
){

  speechSynthesis
    .getVoices();


  speechSynthesis
    .addEventListener(
      "voiceschanged",
      () => {

        const voices =
          speechSynthesis
            .getVoices();

        console.log(
          "Available voices:",
          voices
        );

      }
    );

}


/* =========================================
   SEND TO AI
========================================= */

async function sendMessage(){

  const message =
    messageInput.value.trim();


  if(!message){

    return;

  }


  /* user message */

  addMessage(
    message,
    "user"
  );


  messageInput.value =
    "";


  messageInput.style.height =
    "auto";


  showThinking();


  try{

    const response =
      await fetch(
        RENDER_URL +
        "/api/ai",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message:message
            })

        }
      );


    const data =
      await response.json();


    hideThinking();


    if(
      !response.ok
    ){

      throw new Error(
        data.error ||
        "AI server error"
      );

    }


    const answer =
      data.answer ||
      "দুঃখিত, আমি কোনো উত্তর পাইনি।";


    addMessage(
      answer,
      "ai"
    );


    speak(answer);


  }catch(error){

    hideThinking();


    console.error(
      error
    );


    const errorText =
      "দুঃখিত, এখন ময়না পাখির সাথে যোগাযোগ করা যাচ্ছে না। একটু পরে আবার চেষ্টা করো।";


    addMessage(
      errorText,
      "ai"
    );


  }

}


/* =========================================
   SEND BUTTON
========================================= */

sendBtn.addEventListener(
  "click",
  sendMessage
);


/* =========================================
   ENTER KEY
========================================= */

messageInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================
   TEXTAREA AUTO HEIGHT
========================================= */

messageInput.addEventListener(
  "input",
  () => {

    messageInput.style.height =
      "auto";

    messageInput.style.height =
      Math.min(
        messageInput.scrollHeight,
        100
      ) + "px";

  }
);


/* =========================================
   QUICK QUESTION
========================================= */

function quickAsk(text){

  messageInput.value =
    text;

  sendMessage();

}


/* =========================================
   VOICE BUTTON
========================================= */

voiceBtn.addEventListener(
  "click",
  () => {

    voiceEnabled =
      !voiceEnabled;


    if(voiceEnabled){

      voiceBtn.classList.add(
        "active"
      );

      voiceBtn.textContent =
        "🎙️";

    }

    else{

      voiceBtn.classList.remove(
        "active"
      );

      voiceBtn.textContent =
        "🔇";

      speechSynthesis.cancel();

      speaking = false;

      girl.classList.remove(
        "speaking"
      );

    }

  }
);


/* =========================================
   STOP SPEAKING
========================================= */

stopBtn.addEventListener(
  "click",
  () => {

    if(
      "speechSynthesis"
      in window
    ){

      speechSynthesis.cancel();

    }


    speaking = false;


    girl.classList.remove(
      "speaking"
    );


    aiStatus.classList.remove(
      "active"
    );


    aiStatus.innerHTML =
      "";

  }
);


/* =========================================
   CLEAR CHAT
========================================= */

clearBtn.addEventListener(
  "click",
  () => {

    chat.innerHTML = "";


    addMessage(
      "চ্যাট পরিষ্কার করা হয়েছে। আবার কথা বলি 🐦",
      "ai"
    );

  }
);


/* =========================================
   SPEECH RECOGNITION
========================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(SpeechRecognition){

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "bn-BD";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.onstart = () => {

    messageInput.placeholder =
      "শুনছি...";

    voiceBtn.textContent =
      "🔴";

  };


  recognition.onresult =
    event => {

      const transcript =
        event
          .results[0][0]
          .transcript;


      messageInput.value =
        transcript;


      sendMessage();

    };


  recognition.onerror =
    error => {

      console.log(
        "Voice recognition:",
        error
      );

      messageInput.placeholder =
        "ময়না পাখিকে কিছু বলো...";

      voiceBtn.textContent =
        voiceEnabled
          ? "🎙️"
          : "🔇";

    };


  recognition.onend = () => {

    messageInput.placeholder =
      "ময়না পাখিকে কিছু বলো...";

    voiceBtn.textContent =
      voiceEnabled
        ? "🎙️"
        : "🔇";

  };


  voiceBtn.addEventListener(
    "dblclick",
    () => {

      try{

        recognition.start();

      }catch(error){

        console.log(error);

      }

    }
  );

}


/* =========================================
   INITIAL VOICE LOAD
========================================= */

window.addEventListener(
  "load",
  () => {

    if(
      "speechSynthesis"
      in window
    ){

      speechSynthesis
        .getVoices();

    }

  }
);

</script>
