<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ময়না পাখি 🐦</title>

<meta name="theme-color" content="#ffd6e8">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  color:#5b3850;

  background:
    radial-gradient(circle at 20% 10%,#fff5fa 0%,transparent 30%),
    radial-gradient(circle at 85% 20%,#eee4ff 0%,transparent 30%),
    linear-gradient(160deg,#fff0f7,#f6edff,#fff8fb);

  overflow-x:hidden;
}

button{
  font-family:inherit;
}

.heart{
  position:fixed;
  font-size:20px;
  opacity:.35;
  pointer-events:none;
  animation:floatHeart 7s linear infinite;
}

.heart1{left:8%;top:80%}
.heart2{left:85%;top:65%;animation-delay:2s}
.heart3{left:15%;top:30%;animation-delay:4s}
.heart4{left:75%;top:35%;animation-delay:1s}

@keyframes floatHeart{
  0%{
    transform:translateY(30px);
    opacity:0;
  }

  30%{
    opacity:.4;
  }

  100%{
    transform:translateY(-160px);
    opacity:0;
  }
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:20px 18px;
  display:flex;
  flex-direction:column;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 4px;
}

.logo{
  font-size:23px;
  font-weight:bold;
  color:#b34f83;
  letter-spacing:1px;
}

.logo span{
  font-size:27px;
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:11px;
  color:#58a87a;
  background:rgba(255,255,255,.72);
  padding:7px 11px;
  border-radius:20px;
  box-shadow:0 5px 15px rgba(150,80,120,.08);
}

.statusDot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#58c98a;
  box-shadow:0 0 10px #58c98a;
}

.character{
  width:215px;
  height:215px;
  margin:30px auto 20px;
  border-radius:50%;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle,
      #ffffff 0%,
      #ffe3ef 42%,
      #f7c5dd 70%,
      transparent 71%
    );

  box-shadow:
    0 15px 50px rgba(196,104,150,.22),
    inset 0 0 30px rgba(255,255,255,.8);
}

.character::before{
  content:"";
  position:absolute;
  width:215px;
  height:215px;
  border-radius:50%;
  border:1px solid rgba(211,111,161,.3);
  animation:rotate 12s linear infinite;
}

.character::after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  border:1px dashed rgba(166,126,201,.35);
  animation:rotateReverse 9s linear infinite;
}

.myna{
  position:relative;
  width:120px;
  height:120px;
  border-radius:50%;

  background:
    linear-gradient(145deg,#fffdfd,#ffe4ef);

  box-shadow:
    0 10px 30px rgba(150,70,110,.15);

  animation:breathe 3s ease-in-out infinite;
}

.eye{
  position:absolute;
  width:15px;
  height:18px;
  border-radius:50%;
  background:#5b3d52;
  top:42px;
}

.eye::after{
  content:"";
  position:absolute;
  width:5px;
  height:5px;
  background:white;
  border-radius:50%;
  left:3px;
  top:3px;
}

.eye.left{
  left:29px;
}

.eye.right{
  right:29px;
}

.blush{
  position:absolute;
  width:25px;
  height:12px;
  border-radius:50%;
  background:#ffb6d0;
  opacity:.65;
  top:68px;
}

.blush.left{
  left:13px;
}

.blush.right{
  right:13px;
}

.beak{
  position:absolute;
  left:50%;
  top:57px;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:13px solid transparent;
  border-right:13px solid transparent;
  border-top:18px solid #f3a04e;
}

.ribbon{
  position:absolute;
  top:-8px;
  right:15px;
  font-size:31px;
}

@keyframes breathe{
  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.04);
  }
}

@keyframes rotate{
  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }
}

@keyframes rotateReverse{
  from{
    transform:rotate(360deg);
  }

  to{
    transform:rotate(0deg);
  }
}

.greeting{
  text-align:center;
  margin-top:8px;
}

.greeting h1{
  font-size:28px;
  color:#a94c79;
  margin-bottom:7px;
}

.greeting p{
  color:#9a7488;
  font-size:14px;
}

.commandCard{
  margin-top:24px;
  min-height:110px;
  padding:18px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;

  border-radius:24px;

  background:rgba(255,255,255,.75);

  border:1px solid rgba(255,255,255,.95);

  box-shadow:
    0 12px 35px rgba(155,83,125,.12);

  backdrop-filter:blur(15px);
}

#command{
  font-size:15px;
  line-height:1.7;
  color:#68465a;
}

.userText{
  margin-top:6px;
  font-size:12px;
  color:#b0889c;
}

.micArea{
  display:flex;
  justify-content:center;
  margin-top:25px;
}

.mic{
  width:84px;
  height:84px;
  border:none;
  border-radius:50%;
  cursor:pointer;
  color:white;
  font-size:31px;

  background:
    linear-gradient(145deg,#ff8fba,#bd80e8);

  box-shadow:
    0 12px 30px rgba(190,100,155,.28),
    0 0 25px rgba(255,143,186,.25);

  transition:.2s;
}

.mic:active{
  transform:scale(.90);
}

.mic.listening{
  animation:listening 1s infinite;
}

@keyframes listening{

  0%,100%{
    transform:scale(1);
    box-shadow:0 0 20px #ff8fba;
  }

  50%{
    transform:scale(1.1);
    box-shadow:0 0 50px #bd80e8;
  }

}

.controlArea{
  display:flex;
  justify-content:center;
  gap:9px;
  margin-top:14px;
  flex-wrap:wrap;
}

.controlBtn{
  border:none;
  padding:9px 13px;
  border-radius:20px;

  background:rgba(255,255,255,.75);

  color:#81566e;

  font-size:11px;

  box-shadow:
    0 5px 15px rgba(150,80,120,.08);

  cursor:pointer;
}

.controlBtn.active{
  background:linear-gradient(
    135deg,
    #ff8fba,
    #bd80e8
  );

  color:white;
}

.sectionTitle{
  margin-top:30px;
  margin-bottom:12px;
  text-align:center;
  font-size:13px;
  color:#a2788c;
}

.commands{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:9px;
}

.commandTag{
  padding:10px 14px;
  border-radius:22px;

  background:rgba(255,255,255,.72);

  border:1px solid rgba(255,255,255,.9);

  color:#795569;
  font-size:12px;

  box-shadow:
    0 5px 15px rgba(150,80,120,.07);

  cursor:pointer;

  transition:.2s;
}

.commandTag:active{
  transform:scale(.94);
}

.footer{
  margin-top:auto;
  padding-top:35px;
  text-align:center;
  color:#b08e9f;
  font-size:11px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;

  transform:
    translateX(-50%)
    translateY(30px);

  background:rgba(80,50,75,.92);
  color:white;

  padding:10px 17px;

  border-radius:20px;

  font-size:12px;

  opacity:0;

  pointer-events:none;

  transition:.3s;

  z-index:999;
}

.toast.show{
  opacity:1;
  transform:
    translateX(-50%)
    translateY(0);
}

@media(max-height:700px){

  .character{
    width:175px;
    height:175px;
  }

  .character::before{
    width:175px;
    height:175px;
  }

  .character::after{
    width:145px;
    height:145px;
  }

  .myna{
    width:100px;
    height:100px;
  }

  .eye{
    top:34px;
  }

  .beak{
    top:49px;
  }

}

</style>
</head>

<body>

<div class="heart heart1">♡</div>
<div class="heart heart2">♡</div>
<div class="heart heart3">♡</div>
<div class="heart heart4">♡</div>

<div class="app">

  <div class="header">

    <div class="logo">
      <span>🐦</span>
      ময়না পাখি
    </div>

    <div class="status">
      <span class="statusDot"></span>
      ONLINE
    </div>

  </div>


  <div class="character">

    <div class="myna">

      <div class="ribbon">🎀</div>

      <div class="eye left"></div>
      <div class="eye right"></div>

      <div class="blush left"></div>
      <div class="blush right"></div>

      <div class="beak"></div>

    </div>

  </div>


  <div class="greeting">

    <h1>হ্যালো 🌸</h1>

    <p>
      আমি তোমার ময়না পাখি 🐦
    </p>

  </div>


  <div class="commandCard">

    <div id="command">
      মাইক্রোফোনে চাপ দিয়ে কথা বলো... 💕
    </div>

    <div
      class="userText"
      id="userText">
    </div>

  </div>


  <div class="micArea">

    <button
      class="mic"
      id="mic"
      aria-label="ময়না পাখির সাথে কথা বলুন">
      🎙️
    </button>

  </div>


  <div class="controlArea">

    <button
      class="controlBtn"
      id="conversationBtn">
      🔄 কথোপকথন
    </button>

    <button
      class="controlBtn active"
      id="voiceBtn">
      🔊 ভয়েস চালু
    </button>

    <button
      class="controlBtn"
      id="stopBtn">
      ⏹ থামাও
    </button>

  </div>


  <div class="sectionTitle">
    আমাকে যা বলতে পারো 🌷
  </div>


  <div class="commands">

    <div
      class="commandTag"
      data-command="হ্যালো">
      হ্যালো 👋
    </div>

    <div
      class="commandTag"
      data-command="ময়না পাখি">
      ময়না পাখি 🐦
    </div>

    <div
      class="commandTag"
      data-command="কেমন আছো">
      কেমন আছো? 😊
    </div>

    <div
      class="commandTag"
      data-command="সময় কত">
      সময় কত? ⏰
    </div>

    <div
      class="commandTag"
      data-command="আজ কত তারিখ">
      আজ কত তারিখ? 📅
    </div>

    <div
      class="commandTag"
      data-command="YouTube খোলো">
      YouTube ▶️
    </div>

    <div
      class="commandTag"
      data-command="Google খোলো">
      Google 🔎
    </div>

    <div
      class="commandTag"
      data-command="কী করতে পারো">
      কী করতে পারো? 🌸
    </div>

    <div
      class="commandTag"
      data-command="পাঁচ মিনিটের টাইমার">
      ৫ মিনিট টাইমার ⏱️
    </div>

    <div
      class="commandTag"
      data-command="আবহাওয়া দেখাও">
      আবহাওয়া 🌤️
    </div>

  </div>


  <div class="footer">
    ময়না পাখি 🐦 • Personal AI Assistant
  </div>

</div>


<div
  class="toast"
  id="toast">
</div>


<script>

/* =================================================
   ELEMENTS
================================================= */

const mic =
  document.getElementById("mic");

const command =
  document.getElementById("command");

const userText =
  document.getElementById("userText");

const conversationBtn =
  document.getElementById("conversationBtn");

const voiceBtn =
  document.getElementById("voiceBtn");

const stopBtn =
  document.getElementById("stopBtn");

const toast =
  document.getElementById("toast");


/* =================================================
   SETTINGS
================================================= */

let conversationMode = false;

let voiceEnabled = true;

let recognitionRunning = false;

let timerId = null;


/* =================================================
   TOAST
================================================= */

function showToast(text){

  toast.innerText = text;

  toast.classList.add("show");

  setTimeout(function(){

    toast.classList.remove("show");

  },2200);

}


/* =================================================
   SPEECH RECOGNITION
================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;


if(SpeechRecognition){

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "bn-BD";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    1;


  recognition.onstart =
    function(){

      recognitionRunning = true;

      mic.classList.add("listening");

      command.innerText =
        "হুম... বলো, শুনছি 😊";

    };


  recognition.onend =
    function(){

      recognitionRunning = false;

      mic.classList.remove("listening");

    };


  recognition.onerror =
    function(event){

      recognitionRunning = false;

      mic.classList.remove("listening");

      console.log(
        "Recognition error:",
        event.error
      );

      if(event.error === "not-allowed"){

        respond(
          "মাইক্রোফোনের অনুমতি দেওয়া হয়নি। Chrome-এর microphone permission চালু করো।"
        );

        return;

      }

      if(event.error === "no-speech"){

        command.innerText =
          "কোনো কথা শুনতে পাইনি। আবার বলো 😊";

        return;

      }

      command.innerText =
        "কথাটা ঠিক বুঝতে পারিনি। আবার বলো 😊";

    };


  recognition.onresult =
    function(event){

      const text =
        event.results[0][0].transcript;

      userText.innerText =
        "তুমি বলেছ: " + text;

      processCommand(text);

    };

}
else{

  command.innerText =
    "এই ব্রাউজারে Voice Recognition নেই। Chrome ব্যবহার করো।";

}


/* =================================================
   START LISTENING
================================================= */

function startListening(){

  if(!recognition){

    alert(
      "Chrome ব্যবহার করে আবার চেষ্টা করো।"
    );

    return;

  }

  if(recognitionRunning){

    return;

  }

  try{

    recognition.start();

  }
  catch(error){

    console.log(
      "Recognition error:",
      error
    );

  }

}


/* =================================================
   MICROPHONE BUTTON
================================================= */

mic.addEventListener(
  "click",
  function(){

    startListening();

  }
);


/* =================================================
   CONVERSATION MODE
================================================= */

conversationBtn.addEventListener(
  "click",
  function(){

    conversationMode =
      !conversationMode;

    conversationBtn.classList.toggle(
      "active",
      conversationMode
    );

    if(conversationMode){

      conversationBtn.innerText =
        "🔄 কথোপকথন চালু";

      showToast(
        "কথোপকথন মোড চালু হয়েছে"
      );

      startListening();

    }
    else{

      conversationBtn.innerText =
        "🔄 কথোপকথন";

      showToast(
        "কথোপকথন মোড বন্ধ"
      );

    }

  }
);


/* =================================================
   VOICE ON/OFF
================================================= */

voiceBtn.addEventListener(
  "click",
  function(){

    voiceEnabled =
      !voiceEnabled;

    voiceBtn.classList.toggle(
      "active",
      voiceEnabled
    );

    if(voiceEnabled){

      voiceBtn.innerText =
        "🔊 ভয়েস চালু";

      showToast(
        "ময়না পাখির ভয়েস চালু"
      );

    }
    else{

      voiceBtn.innerText =
        "🔇 ভয়েস বন্ধ";

      speechSynthesis.cancel();

      showToast(
        "ভয়েস বন্ধ করা হয়েছে"
      );

    }

  }
);


/* =================================================
   STOP VOICE
================================================= */

stopBtn.addEventListener(
  "click",
  function(){

    if(
      "speechSynthesis" in window
    ){

      speechSynthesis.cancel();

    }

    if(
      recognition &&
      recognitionRunning
    ){

      try{

        recognition.stop();

      }
      catch(e){}

    }

    command.innerText =
      "ঠিক আছে, থামলাম 😊";

  }
);


/* =================================================
   REMOVE EMOJI FROM TTS
================================================= */

function cleanForSpeech(text){

  let result =
    String(text);


  /*
     Unicode emoji
  */

  result =
    result.replace(
      /[\u{1F000}-\u{1FAFF}]/gu,
      ""
    );


  result =
    result.replace(
      /[\u{2600}-\u{27BF}]/gu,
      ""
    );


  /*
     অতিরিক্ত symbols
  */

  result =
    result.replace(
      /[❤️💕💗💖💓💞💝💘💟💜💙💚💛🧡🤍🖤🤎🩷🩵🩶🫶🥰😘😊😄😃😁😌🌸🌷🌹🌺🌻🌼🎀🐦👋⏰📅▶️🔎🌤️⏱️🔊🔇⏹🔄]/gu,
      ""
    );


  /*
     Website URL-এর অদ্ভুত অংশ বাদ
  */

  result =
    result.replace(
      /https?:\/\/\S+/gi,
      ""
    );


  result =
    result.replace(
      /\s+/g,
      " "
    );


  return result.trim();

}


/* =================================================
   VOICE STORAGE
================================================= */

let availableVoices = [];


/* =================================================
   LOAD VOICES
================================================= */

function loadVoices(){

  if(
    !("speechSynthesis" in window)
  ){

    return;

  }

  availableVoices =
    speechSynthesis.getVoices();

  console.log(
    "Available voices:",
    availableVoices.map(
      v =>
        v.name +
        " | " +
        v.lang
    )
  );

}


if(
  "speechSynthesis" in window
){

  loadVoices();

  speechSynthesis.onvoiceschanged =
    function(){

      loadVoices();

    };

}


/* =================================================
   FIND BANGLA VOICE
================================================= */

function getBanglaVoice(){

  if(!availableVoices.length){

    loadVoices();

  }

  const voices =
    availableVoices;


  if(!voices.length){

    return null;

  }


  const bangla =
    voices.filter(
      function(v){

        const lang =
          String(
            v.lang || ""
          ).toLowerCase();

        return(
          lang === "bn-bd" ||
          lang === "bn-in" ||
          lang.startsWith("bn")
        );

      }
    );


  if(!bangla.length){

    return null;

  }


  /*
     সম্ভাব্য natural/female voice
  */

  const femaleKeywords = [

    "female",
    "woman",
    "girl",
    "zira",
    "samantha",
    "susan",
    "karen",
    "aria",
    "jenny",
    "ava",
    "emma",
    "salli",
    "neural",
    "premium",
    "natural"

  ];


  const female =
    bangla.find(
      function(v){

        const name =
          String(
            v.name || ""
          ).toLowerCase();

        return femaleKeywords.some(
          keyword =>
            name.includes(keyword)
        );

      }
    );


  if(female){

    return female;

  }


  /*
     Google voice
  */

  const google =
    bangla.find(
      function(v){

        return String(
          v.name || ""
        )
        .toLowerCase()
        .includes("google");

      }
    );


  if(google){

    return google;

  }


  return bangla[0];

}


/* =================================================
   SPEAK
================================================= */

function speak(text){

  if(!voiceEnabled){

    return;

  }


  if(
    !("speechSynthesis" in window)
  ){

    return;

  }


  const cleanText =
    cleanForSpeech(text);


  if(!cleanText){

    return;

  }


  speechSynthesis.cancel();

  loadVoices();


  const voice =
    getBanglaVoice();


  const speech =
    new SpeechSynthesisUtterance(
      cleanText
    );


  speech.lang =
    voice && voice.lang
      ? voice.lang
      : "bn-BD";


  if(voice){

    speech.voice =
      voice;

    console.log(
      "Selected voice:",
      voice.name,
      voice.lang
    );

  }


  /*
     মিষ্টি গতি
  */

  speech.rate =
    0.86;


  /*
     Pitch সামান্য বেশি
  */

  speech.pitch =
    1.18;


  speech.volume =
    1;


  speech.onerror =
    function(event){

      console.log(
        "TTS error:",
        event
      );

    };


  speechSynthesis.speak(
    speech
  );

}


/* =================================================
   RESPONSE
================================================= */

function respond(text){

  command.innerText =
    text;

  speak(text);


  /*
     কথোপকথন মোডে উত্তর দেওয়ার
     কিছুক্ষণ পর আবার শুনবে
  */

  if(conversationMode){

    setTimeout(
      function(){

        if(conversationMode){

          startListening();

        }

      },
      1800
    );

  }

}

/* =================================================
   CALCULATOR
================================================= */

function calculateExpression(text){

  let expression =
    text
      .replace(/যোগ/gi,"+")
      .replace(/বিয়োগ/gi,"-")
      .replace(/বিয়োগ/gi,"-")
      .replace(/গুণ/gi,"*")
      .replace(/ভাগ/gi,"/")
      .replace(/প্লাস/gi,"+")
      .replace(/মাইনাস/gi,"-")
      .replace(/×/g,"*")
      .replace(/÷/g,"/");


  /*
     শুধু নিরাপদ mathematical characters
  */

  expression =
    expression.replace(
      /[^0-9+\-*/().\s]/g,
      ""
    );


  if(!expression){

    return null;

  }


  try{

    const result =
      Function(
        '"use strict";return (' +
        expression +
        ')'
      )();


    if(
      typeof result === "number" &&
      Number.isFinite(result)
    ){

      return result;

    }

  }
  catch(error){

    return null;

  }

  return null;

}


/* =================================================
   TIMER
================================================= */

function startTimer(minutes){

  if(timerId){

    clearTimeout(timerId);

  }


  const milliseconds =
    minutes * 60 * 1000;


  timerId =
    setTimeout(
      function(){

        respond(
          "তোমার " +
          minutes +
          " মিনিটের টাইমার শেষ হয়েছে।"
        );

      },
      milliseconds
    );


  respond(
    minutes +
    " মিনিটের টাইমার শুরু করেছি।"
  );

}


/* =================================================
   COMMAND PROCESSOR
================================================= */

function processCommand(text){

  const c =
    text
      .toLowerCase()
      .trim();


  /* -----------------------------------------------
     EMPTY
  ----------------------------------------------- */

  if(!c){

    return;

  }


  /* -----------------------------------------------
     MYNA
  ----------------------------------------------- */

  if(
    c.includes("ময়না") ||
    c.includes("ময়না") ||
    c.includes("পাখি") ||
    c.includes("moyna")
  ){

    respond(
      "হুম, ময়না পাখি এখানে আছি। বলো, কী করতে হবে?"
    );

    return;

  }


  /* -----------------------------------------------
     HELLO
  ----------------------------------------------- */

  if(
    c.includes("হ্যালো") ||
    c.includes("হাই") ||
    c.includes("হেই") ||
    c.includes("hello") ||
    c.includes("hi")
  ){

    respond(
      "হ্যালো। বলো, কীভাবে সাহায্য করতে পারি?"
    );

    return;

  }


  /* -----------------------------------------------
     HOW ARE YOU
  ----------------------------------------------- */

  if(
    c.includes("কেমন আছ") ||
    c.includes("কেমন আছো") ||
    c.includes("ভালো আছ")
  ){

    respond(
      "আমি ভালো আছি। তোমার কথা শুনতে প্রস্তুত।"
    );

    return;

  }


  /* -----------------------------------------------
     WHAT ARE YOU DOING
  ----------------------------------------------- */

  if(
    c.includes("কি করছ") ||
    c.includes("কী করছ") ||
    c.includes("কি করছো") ||
    c.includes("কী করছো")
  ){

    respond(
      "তোমার কমান্ডের অপেক্ষায় আছি। বলো কী কাজ করব?"
    );

    return;

  }


  /* -----------------------------------------------
     WHO ARE YOU
  ----------------------------------------------- */

  if(
    c.includes("তুমি কে") ||
    c.includes("কে তুমি")
  ){

    respond(
      "আমি ময়না পাখি। তোমার ব্যক্তিগত এআই অ্যাসিস্ট্যান্ট।"
    );

    return;

  }


  /* -----------------------------------------------
     WHAT CAN YOU DO
  ----------------------------------------------- */

  if(
    c.includes("কি করতে পার") ||
    c.includes("কী করতে পার") ||
    c.includes("কি কি করতে পার") ||
    c.includes("কী কী করতে পার")
  ){

    respond(
      "আমি সময় ও তারিখ বলতে, গুগল সার্চ করতে, ইউটিউব খুলতে, হিসাব করতে, টাইমার দিতে এবং আরও কিছু কাজ করতে পারি।"
    );

    return;

  }


  /* -----------------------------------------------
     TIME
  ----------------------------------------------- */

  if(
    c.includes("সময়") ||
    c.includes("সময়") ||
    c.includes("টাইম") ||
    c.includes("কয়টা বাজে") ||
    c.includes("কয়টা বাজে")
  ){

    const now =
      new Date();


    const time =
      now.toLocaleTimeString(
        "bn-BD",
        {
          hour:"numeric",
          minute:"numeric"
        }
      );


    respond(
      "এখন সময় " +
      time +
      "।"
    );

    return;

  }


  /* -----------------------------------------------
     DATE
  ----------------------------------------------- */

  if(
    c.includes("আজ কত তারিখ") ||
    c.includes("আজকের তারিখ") ||
    c.includes("তারিখ কত")
  ){

    const now =
      new Date();


    const date =
      now.toLocaleDateString(
        "bn-BD",
        {
          year:"numeric",
          month:"long",
          day:"numeric"
        }
      );


    respond(
      "আজ " +
      date +
      "।"
    );

    return;

  }


  /* -----------------------------------------------
     CALCULATOR
  ----------------------------------------------- */

  if(
    c.includes("কত হবে") ||
    c.includes("হিসাব কর") ||
    c.includes("হিসাব") ||
    c.includes("যোগ") ||
    c.includes("বিয়োগ") ||
    c.includes("বিয়োগ") ||
    c.includes("গুণ") ||
    c.includes("ভাগ")
  ){

    const result =
      calculateExpression(c);


    if(result !== null){

      respond(
        "হিসাবের ফলাফল " +
        result +
        "।"
      );

      return;

    }

  }


  /* -----------------------------------------------
     GOOGLE SEARCH
  ----------------------------------------------- */

  if(
    c.startsWith("গুগলে") ||
    c.startsWith("google এ") ||
    c.startsWith("google-এ") ||
    c.startsWith("গুগল সার্চ")
  ){

    let query =
      c
        .replace("গুগলে","")
        .replace("google এ","")
        .replace("google-এ","")
        .replace("গুগল সার্চ","")
        .trim();


    if(!query){

      respond(
        "কী সার্চ করতে হবে বলো।"
      );

      return;

    }


    respond(
      "ঠিক আছে। গুগলে সার্চ করছি।"
    );


    setTimeout(
      function(){

        googleSearch(query);

      },
      1000
    );

    return;

  }


  /* -----------------------------------------------
     YOUTUBE SEARCH
  ----------------------------------------------- */

  if(
    c.startsWith("ইউটিউবে") ||
    c.startsWith("youtube এ") ||
    c.startsWith("youtube-এ") ||
    c.startsWith("ইউটিউব সার্চ")
  ){

    let query =
      c
        .replace("ইউটিউবে","")
        .replace("youtube এ","")
        .replace("youtube-এ","")
        .replace("ইউটিউব সার্চ","")
        .trim();


    if(!query){

      respond(
        "ইউটিউবে কী খুঁজতে হবে বলো।"
      );

      return;

    }


    respond(
      "ঠিক আছে। ইউটিউবে সার্চ করছি।"
    );


    setTimeout(
      function(){

        youtubeSearch(query);

      },
      1000
    );

    return;

  }


  /* -----------------------------------------------
     YOUTUBE OPEN
  ----------------------------------------------- */

  if(
    c.includes("youtube") ||
    c.includes("ইউটিউব")
  ){

    respond(
      "আচ্ছা। ইউটিউব খুলছি।"
    );


    setTimeout(
      function(){

        openURL(
          "https://www.youtube.com/"
        );

      },
      1000
    );

    return;

  }


  /* -----------------------------------------------
     GOOGLE OPEN
  ----------------------------------------------- */

  if(
    c.includes("google") ||
    c.includes("গুগল")
  ){

    respond(
      "ঠিক আছে। গুগল খুলছি।"
    );


    setTimeout(
      function(){

        openURL(
          "https://www.google.com/"
        );

      },
      1000
    );

    return;

  }


  /* -----------------------------------------------
     FACEBOOK
  ----------------------------------------------- */

  if(
    c.includes("facebook") ||
    c.includes("ফেসবুক")
  ){

    respond(
      "আচ্ছা। ফেসবুক খুলছি।"
    );


    setTimeout(
      function(){

        openURL(
          "https://www.facebook.com/"
        );

      },
      1000
    );

    return;

  }


  /* -----------------------------------------------
     WEATHER
  ----------------------------------------------- */

  if(
    c.includes("আবহাওয়া") ||
    c.includes("আবহাওয়া") ||
    c.includes("weather")
  ){

    respond(
      "ঠিক আছে। আবহাওয়ার তথ্য দেখাচ্ছি।"
    );


    setTimeout(
      function(){

        openURL(
          "https://www.google.com/search?q=আজকের+আবহাওয়া"
        );

      },
      1000
    );

    return;

  }


  /* -----------------------------------------------
     TIMER
  ----------------------------------------------- */

  if(
    c.includes("মিনিটের টাইমার") ||
    c.includes("মিনিট টাইমার")
  ){

    const match =
      c.match(
        /(\d+)\s*মিনিট/
      );


    if(match){

      const minutes =
        Number(
          match[1]
        );


      if(
        minutes > 0 &&
        minutes <= 120
      ){

        startTimer(
          minutes
        );

        return;

      }

    }


    respond(
      "কত মিনিটের টাইমার দিতে হবে বলো।"
    );

    return;

  }


  /* -----------------------------------------------
     THANK YOU
  ----------------------------------------------- */

  if(
    c.includes("ধন্যবাদ") ||
    c.includes("থ্যাংক ইউ") ||
    c.includes("thank you")
  ){

    respond(
      "স্বাগতম। আর কোনো কাজে সাহায্য করতে পারি?"
    );

    return;

  }


  /* -----------------------------------------------
     GOOD MORNING
  ----------------------------------------------- */

  if(
    c.includes("শুভ সকাল") ||
    c.includes("গুড মর্নিং")
  ){

    respond(
      "শুভ সকাল। আশা করি আজকের দিনটা ভালো কাটবে।"
    );

    return;

  }


  /* -----------------------------------------------
     GOOD NIGHT
  ----------------------------------------------- */

  if(
    c.includes("শুভ রাত্রি") ||
    c.includes("শুভ রাত") ||
    c.includes("গুড নাইট")
  ){

    respond(
      "শুভ রাত্রি। ভালোভাবে বিশ্রাম নাও।"
    );

    return;

  }


  /* -----------------------------------------------
     YES
  ----------------------------------------------- */

  if(
    c === "হ্যাঁ" ||
    c === "হ্যা" ||
    c === "হুম"
  ){

    respond(
      "ঠিক আছে।"
    );

    return;

  }


  /* -----------------------------------------------
     NO
  ----------------------------------------------- */

  if(
    c === "না"
  ){

    respond(
      "আচ্ছা, ঠিক আছে।"
    );

    return;

  }


  /* -----------------------------------------------
     UNKNOWN
  ----------------------------------------------- */

  respond(
    "হুম, এই কাজটা এখনো আমাকে শেখানো হয়নি। চাইলে আমাকে আরও কাজ শেখানো যাবে।"
  );

}
