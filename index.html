<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07111f">

<title>ময়না পাখি 🐦</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#07111f;
  --bg2:#0d1b2e;
  --card:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.10);
  --cyan:#42e8ff;
  --blue:#4f7cff;
  --purple:#9b5cff;
  --text:#f7fbff;
  --muted:#9eacbd;
}

body{
  min-height:100vh;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Bengali",
    sans-serif;
  color:var(--text);

  background:
    radial-gradient(circle at 50% -10%,#214d72 0%,transparent 35%),
    radial-gradient(circle at 0% 70%,#182b58 0%,transparent 30%),
    linear-gradient(160deg,#07111f,#050912 70%);

  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 20% 30%,rgba(66,232,255,.07),transparent 18%),
    radial-gradient(circle at 80% 45%,rgba(155,92,255,.08),transparent 20%);
}

/* APP */

.app{
  width:100%;
  max-width:540px;
  min-height:100vh;
  margin:auto;
  position:relative;
  display:flex;
  flex-direction:column;
}

/* HEADER */

.header{
  padding:18px 18px 8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  display:flex;
  align-items:center;
  gap:11px;
}

.logo-icon{
  width:46px;
  height:46px;
  border-radius:15px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:25px;

  background:
    linear-gradient(135deg,#42e8ff,#4f7cff,#9b5cff);

  box-shadow:
    0 8px 30px rgba(66,232,255,.18);
}

.logo-text h1{
  font-size:20px;
  font-weight:800;
}

.logo-text p{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.status{
  display:flex;
  align-items:center;
  gap:6px;
  color:#9eacbd;
  font-size:11px;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#49ef9a;
  box-shadow:0 0 12px #49ef9a;
}

/* AI AREA */

.avatar-area{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:8px 20px 0;
}

.ai-stage{
  position:relative;
  width:225px;
  height:240px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.ai-ring{
  position:absolute;
  width:205px;
  height:205px;
  border-radius:50%;

  background:
    radial-gradient(circle,
      rgba(66,232,255,.12),
      rgba(79,124,255,.05) 45%,
      transparent 70%
    );

  border:1px solid rgba(66,232,255,.16);

  box-shadow:
    0 0 55px rgba(66,232,255,.10);

  animation:ringPulse 3s ease-in-out infinite;
}

.ai-ring::before,
.ai-ring::after{
  content:"";
  position:absolute;
  inset:13px;
  border-radius:50%;
  border:1px solid rgba(155,92,255,.12);
}

.ai-ring::after{
  inset:28px;
  border-color:rgba(66,232,255,.10);
}

@keyframes ringPulse{
  0%,100%{
    transform:scale(1);
    opacity:.75;
  }
  50%{
    transform:scale(1.05);
    opacity:1;
  }
}

/* GIRL */

.girl{
  width:190px;
  height:220px;
  position:relative;
  z-index:2;
  animation:floatGirl 4s ease-in-out infinite;
}

@keyframes floatGirl{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-6px);
  }
}

.hair{
  position:absolute;
  width:150px;
  height:190px;
  left:20px;
  top:5px;

  border-radius:80px 80px 55px 55px;

  background:
    linear-gradient(145deg,#101725,#263d62);

  box-shadow:
    0 20px 40px rgba(0,0,0,.45);
}

.face{
  position:absolute;
  width:105px;
  height:125px;
  left:42px;
  top:35px;

  border-radius:48% 48% 46% 46%;

  background:
    linear-gradient(145deg,#ffe0cc,#efbba5);

  z-index:2;

  box-shadow:
    inset -7px -8px 15px rgba(120,55,50,.10);
}

.hair-front{
  position:absolute;
  width:115px;
  height:65px;
  left:36px;
  top:20px;

  border-radius:65px 65px 25px 20px;

  background:
    linear-gradient(145deg,#111827,#29466e);

  z-index:3;
}

.eye{
  position:absolute;
  width:22px;
  height:14px;
  top:78px;

  background:#fff;
  border-radius:50%;
  z-index:5;
  overflow:hidden;

  animation:blink 5s infinite;
}

.eye.left{
  left:61px;
}

.eye.right{
  left:106px;
}

.eye::after{
  content:"";
  position:absolute;
  width:9px;
  height:9px;
  left:7px;
  top:3px;
  border-radius:50%;
  background:#253b63;
}

@keyframes blink{
  0%,45%,48%,100%{
    transform:scaleY(1);
  }
  46%,47%{
    transform:scaleY(.08);
  }
}

.nose{
  position:absolute;
  left:90px;
  top:92px;
  width:8px;
  height:13px;
  border-left:2px solid rgba(120,70,70,.18);
  z-index:5;
}

.mouth{
  position:absolute;
  left:80px;
  top:112px;
  width:28px;
  height:8px;
  border-radius:0 0 18px 18px;
  border-bottom:3px solid #b34c70;
  z-index:5;
  transition:.15s;
}

.speaking .mouth{
  height:18px;
  background:#8d3154;
  border:2px solid #64203c;
  animation:mouthTalk .18s infinite alternate;
}

@keyframes mouthTalk{
  from{
    transform:scaleY(.6);
  }
  to{
    transform:scaleY(1);
  }
}

.body{
  position:absolute;
  width:125px;
  height:75px;
  left:33px;
  top:150px;

  border-radius:55px 55px 20px 20px;

  background:
    linear-gradient(135deg,#238da8,#4052c7);

  z-index:1;

  box-shadow:
    0 15px 30px rgba(25,88,150,.30);
}

/* THINKING */

.thinking .ai-ring{
  animation:
    ringThinking 1.2s ease-in-out infinite;
}

@keyframes ringThinking{
  0%,100%{
    transform:scale(1);
    box-shadow:0 0 35px rgba(66,232,255,.10);
  }
  50%{
    transform:scale(1.08);
    box-shadow:0 0 65px rgba(66,232,255,.30);
  }
}

.thinking .girl{
  animation:
    thinkingFloat 1.5s ease-in-out infinite;
}

@keyframes thinkingFloat{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-10px);
  }
}

/* AI STATUS */

.ai-status{
  text-align:center;
  height:24px;
  color:#8fa7bd;
  font-size:12px;
}

.ai-status.active{
  color:var(--cyan);
}

.ai-dots span{
  display:inline-block;
  animation:dot 1s infinite;
}

.ai-dots span:nth-child(2){
  animation-delay:.15s;
}

.ai-dots span:nth-child(3){
  animation-delay:.3s;
}

@keyframes dot{
  0%,100%{
    transform:translateY(0);
    opacity:.35;
  }
  50%{
    transform:translateY(-4px);
    opacity:1;
  }
}

/* WELCOME */

.welcome{
  text-align:center;
  padding:0 20px 10px;
}

.welcome h2{
  font-size:23px;
  margin-bottom:5px;
}

.welcome p{
  color:var(--muted);
  font-size:12px;
}

/* CHAT */

.chat{
  flex:1;
  padding:5px 15px 145px;
  overflow-y:auto;
}

.message{
  display:flex;
  margin:9px 0;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:84%;
  padding:11px 14px;
  border-radius:18px;
  line-height:1.6;
  font-size:14px;
  white-space:pre-wrap;
  animation:messageIn .25s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(6px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.message.ai .bubble{
  background:rgba(255,255,255,.065);
  border:1px solid rgba(255,255,255,.08);
  border-bottom-left-radius:5px;
}

.message.user .bubble{
  background:
    linear-gradient(135deg,#278fa9,#4d57d9);

  border-bottom-right-radius:5px;

  box-shadow:
    0 5px 20px rgba(35,111,170,.15);
}

/* THINKING BUBBLE */

.thinking-bubble{
  display:flex;
  align-items:center;
  gap:5px;
  min-width:54px;
}

.thinking-bubble i{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#70dded;
  animation:thinkingDot .8s infinite;
}

.thinking-bubble i:nth-child(2){
  animation-delay:.15s;
}

.thinking-bubble i:nth-child(3){
  animation-delay:.3s;
}

@keyframes thinkingDot{
  0%,100%{
    transform:translateY(0);
    opacity:.3;
  }
  50%{
    transform:translateY(-5px);
    opacity:1;
  }
}

/* QUICK */

.quick{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:7px 15px;
  scrollbar-width:none;
}

.quick::-webkit-scrollbar{
  display:none;
}

.quick button{
  flex-shrink:0;
  border:1px solid rgba(255,255,255,.09);
  color:#dce9f4;
  padding:9px 13px;
  border-radius:20px;
  background:rgba(255,255,255,.055);
  cursor:pointer;
  font-size:12px;
}

/* BOTTOM */

.bottom{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:0;

  width:100%;
  max-width:540px;

  padding:10px 13px 15px;

  background:
    linear-gradient(
      180deg,
      rgba(5,9,18,0),
      rgba(5,9,18,.94) 28%
    );

  z-index:20;
}

.input-row{
  display:flex;
  gap:8px;
  padding:7px;

  border-radius:27px;

  background:rgba(17,29,47,.88);

  border:1px solid rgba(255,255,255,.10);

  backdrop-filter:blur(18px);

  box-shadow:
    0 10px 35px rgba(0,0,0,.30);
}

.input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  color:white;
  background:transparent;
  font-size:14px;
  padding:8px 10px;
}

.input::placeholder{
  color:#718196;
}

.icon-btn,
.send-btn{
  width:43px;
  height:43px;
  border:0;
  border-radius:50%;
  color:white;
  cursor:pointer;
  font-size:17px;
}

.icon-btn{
  background:rgba(255,255,255,.07);
}

.send-btn{
  background:
    linear-gradient(135deg,#35cfe7,#5066e8);

  box-shadow:
    0 5px 20px rgba(65,190,230,.25);
}

.controls{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:8px;
}

.control{
  border:0;
  background:transparent;
  color:#748499;
  font-size:11px;
  cursor:pointer;
}

@media(max-width:380px){

  .girl{
    transform:scale(.88);
  }

  .ai-stage{
    height:225px;
  }

  .welcome h2{
    font-size:21px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="logo">

    <div class="logo-icon">🐦</div>

    <div class="logo-text">
      <h1>ময়না পাখি</h1>
      <p>তোমার AI সঙ্গী</p>
    </div>

  </div>

  <div class="status">
    <span class="status-dot"></span>
    অনলাইন
  </div>

</header>


<section class="avatar-area">

  <div
    class="ai-stage"
    id="aiStage"
  >

    <div class="ai-ring"></div>

    <div
      class="girl"
      id="girl"
    >

      <div class="hair"></div>
      <div class="face"></div>
      <div class="hair-front"></div>

      <div class="eye left"></div>
      <div class="eye right"></div>

      <div class="nose"></div>
      <div class="mouth"></div>

      <div class="body"></div>

    </div>

  </div>

</section>


<div
  class="ai-status"
  id="aiStatus"
></div>


<section class="welcome">

  <h2>হ্যালো! আমি ময়না পাখি 🐦</h2>

  <p>
    তোমার কথা শুনতে এবং উত্তর দিতে আমি প্রস্তুত।
  </p>

</section>


<main
  class="chat"
  id="chat"
>

  <div class="message ai">

    <div class="bubble">
      হ্যালো! আমি ময়না পাখি। ❤️
      আমাকে কিছু জিজ্ঞেস করো।
    </div>

  </div>

</main>


<div class="quick">

  <button onclick="quickAsk('তুমি কে?')">
    তুমি কে?
  </button>

  <button onclick="quickAsk('আজ কেমন আছো?')">
    কেমন আছো?
  </button>

  <button onclick="quickAsk('একটা মজার কথা বলো')">
    মজার কথা
  </button>

  <button onclick="quickAsk('আমাকে একটি গল্প বলো')">
    গল্প বলো
  </button>

</div>


<div class="bottom">

  <div class="input-row">

    <button
      class="icon-btn"
      id="micBtn"
      onclick="startListening()"
    >
      🎤
    </button>

    <input
      class="input"
      id="input"
      type="text"
      placeholder="ময়না পাখিকে কিছু বলো..."
      autocomplete="off"
    >

    <button
      class="send-btn"
      onclick="sendMessage()"
    >
      ➤
    </button>

  </div>


  <div class="controls">

    <button
      class="control"
      onclick="toggleVoice()"
      id="voiceBtn"
    >
      🔊 ভয়েস চালু
    </button>

    <button
      class="control"
      onclick="stopSpeaking()"
    >
      ⏹ থামাও
    </button>

    <button
      class="control"
      onclick="clearChat()"
    >
      🗑 পরিষ্কার
    </button>

  </div>

</div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const RENDER_URL =
  "https://jarvis-1-0yao.onrender.com";


/* =====================================================
   ELEMENTS
===================================================== */

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("input");

const girl =
  document.getElementById("girl");

const aiStage =
  document.getElementById("aiStage");

const aiStatus =
  document.getElementById("aiStatus");

const micBtn =
  document.getElementById("micBtn");

const voiceBtn =
  document.getElementById("voiceBtn");


/* =====================================================
   STATE
===================================================== */

let voiceEnabled = true;
let speaking = false;
let thinking = false;


/* =====================================================
   THINKING UI
===================================================== */

function startThinking(){

  thinking = true;

  aiStage.classList.add("thinking");

  aiStatus.classList.add("active");

  aiStatus.innerHTML =
    'ময়না পাখি ভাবছে <span class="ai-dots">.<span>.</span><span>.</span></span>';

}


function stopThinking(){

  thinking = false;

  aiStage.classList.remove("thinking");

  aiStatus.classList.remove("active");

  aiStatus.innerHTML = "";

}


/* =====================================================
   VOICE
===================================================== */

function cleanForSpeech(text){

  return text
    .replace(/[\u{1F300}-\u{1FAFF}]/gu,"")
    .replace(/[*_#`~]/g,"")
    .replace(/\s+/g," ")
    .trim();
}


function speak(text){

  if(!voiceEnabled){
    return;
  }

  if(!("speechSynthesis" in window)){
    return;
  }

  speechSynthesis.cancel();

  const speechText =
    cleanForSpeech(text);

  if(!speechText){
    return;
  }

  const utterance =
    new SpeechSynthesisUtterance(
      speechText
    );

  utterance.lang = "bn-BD";
  utterance.rate = 0.92;
  utterance.pitch = 1.12;
  utterance.volume = 1;

  const voices =
    speechSynthesis.getVoices();

  const bengaliVoice =
    voices.find(
      v =>
        v.lang &&
        v.lang.toLowerCase()
        .startsWith("bn")
    );

  if(bengaliVoice){
    utterance.voice =
      bengaliVoice;
  }

  utterance.onstart = () => {

    speaking = true;

    girl.classList.add("speaking");

    aiStatus.classList.add("active");

    aiStatus.textContent =
      "ময়না পাখি কথা বলছে...";

  };

  utterance.onend = () => {

    speaking = false;

    girl.classList.remove("speaking");

    aiStatus.classList.remove("active");

    aiStatus.innerHTML = "";

  };

  utterance.onerror = () => {

    speaking = false;

    girl.classList.remove("speaking");

    aiStatus.classList.remove("active");

    aiStatus.innerHTML = "";

  };

  speechSynthesis.speak(
    utterance
  );
}


function stopSpeaking(){

  if("speechSynthesis" in window){
    speechSynthesis.cancel();
  }

  speaking = false;

  girl.classList.remove("speaking");

  if(!thinking){
    aiStatus.innerHTML = "";
    aiStatus.classList.remove("active");
  }
}


function toggleVoice(){

  voiceEnabled =
    !voiceEnabled;

  if(!voiceEnabled){

    stopSpeaking();

    voiceBtn.textContent =
      "🔇 ভয়েস বন্ধ";

  }else{

    voiceBtn.textContent =
      "🔊 ভয়েস চালু";

  }
}


/* =====================================================
   CHAT
===================================================== */

function addMessage(text,type){

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    text;

  message.appendChild(bubble);

  chat.appendChild(message);

  chat.scrollTop =
    chat.scrollHeight;
}


/* =====================================================
   THINKING MESSAGE
===================================================== */

function addThinkingMessage(){

  const message =
    document.createElement("div");

  message.className =
    "message ai";

  message.id =
    "typingMessage";

  message.innerHTML = `
    <div class="bubble thinking-bubble">
      <i></i>
      <i></i>
      <i></i>
    </div>
  `;

  chat.appendChild(message);

  chat.scrollTop =
    chat.scrollHeight;
}


function removeThinkingMessage(){

  const element =
    document.getElementById(
      "typingMessage"
    );

  if(element){
    element.remove();
  }
}


/* =====================================================
   SEND TO GEMINI
===================================================== */

async function sendMessage(){

  const message =
    input.value.trim();

  if(!message){
    return;
  }

  input.value = "";

  addMessage(
    message,
    "user"
  );

  addThinkingMessage();

  startThinking();

  try{

    const response =
      await fetch(
        RENDER_URL +
        "/api/ai",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message:message
            })
        }
      );

    const data =
      await response.json();

    removeThinkingMessage();

    stopThinking();

    if(!response.ok){

      throw new Error(
        data.error ||
        "AI উত্তর দিতে পারেনি"
      );

    }

    const answer =
      data.answer ||
      "দুঃখিত, কোনো উত্তর পাওয়া যায়নি।";

    addMessage(
      answer,
      "ai"
    );

    speak(answer);

  }catch(error){

    removeThinkingMessage();

    stopThinking();

    console.error(
      "AI Error:",
      error
    );

    addMessage(
      "দুঃখিত, এখন একটু সমস্যা হচ্ছে। কিছুক্ষণ পরে আবার চেষ্টা করো।",
      "ai"
    );

  }

}


/* =====================================================
   QUICK ASK
===================================================== */

function quickAsk(text){

  input.value =
    text;

  sendMessage();

}


/* =====================================================
   ENTER
===================================================== */

input.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =====================================================
   SPEECH RECOGNITION
===================================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;
let listening = false;


if(SpeechRecognition){

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "bn-BD";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;


  recognition.onstart = () => {

    listening = true;

    micBtn.textContent =
      "🔴";

    aiStatus.classList.add("active");

    aiStatus.textContent =
      "ময়না পাখি তোমার কথা শুনছে...";

  };


  recognition.onresult =
    event => {

      const transcript =
        event
          .results[0][0]
          .transcript;

      input.value =
        transcript;

      listening = false;

      micBtn.textContent =
        "🎤";

      aiStatus.classList.remove("active");

      aiStatus.innerHTML = "";

      sendMessage();

    };


  recognition.onerror =
    error => {

      console.error(
        "Speech error:",
        error
      );

      listening = false;

      micBtn.textContent =
        "🎤";

      aiStatus.classList.remove("active");

      aiStatus.innerHTML = "";

    };


  recognition.onend =
    () => {

      listening = false;

      micBtn.textContent =
        "🎤";

    };

}


function startListening(){

  if(!recognition){

    alert(
      "এই ব্রাউজারে বাংলা voice recognition সাপোর্ট নেই। Chrome ব্যবহার করে দেখো।"
    );

    return;
  }

  if(listening){

    recognition.stop();

    return;

  }

  try{

    recognition.start();

  }catch(error){

    console.error(error);

  }

}


/* =====================================================
   CLEAR
===================================================== */

function clearChat(){

  stopSpeaking();

  stopThinking();

  chat.innerHTML = "";

  addMessage(
    "চ্যাট পরিষ্কার হয়েছে। আবার আমাকে কিছু জিজ্ঞেস করো। ❤️",
    "ai"
  );

}


/* =====================================================
   VOICES
===================================================== */

if("speechSynthesis" in window){

  speechSynthesis.onvoiceschanged =
    () => {

      speechSynthesis
        .getVoices();

    };

}
