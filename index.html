<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#12091f">

<title>ময়না পাখি AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:
    system-ui,
    "Noto Sans Bengali",
    sans-serif;
  min-height:100vh;
  color:#fff;
  background:
    radial-gradient(circle at 50% 20%,#6e3b91 0%,transparent 35%),
    radial-gradient(circle at 20% 80%,#30205d 0%,transparent 35%),
    linear-gradient(145deg,#080611,#160b25,#080611);
  overflow-x:hidden;
}

/* background lights */

.bg-light{
  position:fixed;
  width:220px;
  height:220px;
  border-radius:50%;
  filter:blur(80px);
  opacity:.35;
  pointer-events:none;
}

.light1{
  background:#d95cff;
  top:-80px;
  left:-60px;
}

.light2{
  background:#695cff;
  right:-80px;
  bottom:80px;
}

/* app */

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:18px 15px 25px;
  display:flex;
  flex-direction:column;
}

/* header */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 3px 15px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-icon{
  width:43px;
  height:43px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#ff72c8,#7659ff);
  box-shadow:0 8px 25px rgba(202,83,255,.3);
  font-size:23px;
}

.logo-text h1{
  font-size:20px;
  font-weight:800;
}

.logo-text p{
  font-size:11px;
  color:#cdbddd;
  margin-top:2px;
}

.status{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  color:#cdbddd;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#42ff9b;
  box-shadow:0 0 12px #42ff9b;
}

/* girl */

.girl-section{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:8px;
}

.girl-glow{
  position:absolute;
  width:280px;
  height:280px;
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(232,100,255,.35),
    rgba(117,77,255,.12),
    transparent 70%
  );
  filter:blur(5px);
}

.girl{
  position:relative;
  width:245px;
  height:310px;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2;
}

/* avatar */

.avatar{
  position:relative;
  width:185px;
  height:245px;
}

/* hair */

.hair{
  position:absolute;
  width:150px;
  height:190px;
  top:12px;
  left:18px;
  background:
    linear-gradient(120deg,#1a1027,#39204b 50%,#160d22);
  border-radius:80px 80px 65px 65px;
  box-shadow:
    0 12px 35px rgba(0,0,0,.55),
    inset -15px 0 20px rgba(255,255,255,.04);
}

/* face */

.face{
  position:absolute;
  width:112px;
  height:137px;
  left:37px;
  top:42px;
  background:
    linear-gradient(145deg,#ffe4d1,#f4c1ad);
  border-radius:52% 48% 48% 50%;
  z-index:2;
  box-shadow:
    0 8px 20px rgba(0,0,0,.25);
}

/* hair front */

.bang{
  position:absolute;
  width:105px;
  height:63px;
  top:25px;
  left:42px;
  background:#24142f;
  border-radius:55% 55% 40% 35%;
  z-index:4;
  transform:rotate(-4deg);
}

/* eyes */

.eye{
  position:absolute;
  width:17px;
  height:11px;
  top:96px;
  background:#24152b;
  border-radius:50%;
  z-index:5;
  transition:.2s;
}

.eye.left{
  left:63px;
}

.eye.right{
  left:108px;
}

.eye::after{
  content:"";
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;
  background:white;
  top:2px;
  left:3px;
}

/* nose */

.nose{
  position:absolute;
  width:5px;
  height:9px;
  border-right:2px solid rgba(160,100,90,.5);
  top:112px;
  left:93px;
  z-index:5;
}

/* mouth */

.mouth{
  position:absolute;
  width:24px;
  height:9px;
  left:82px;
  top:132px;
  border-bottom:3px solid #c75b78;
  border-radius:0 0 50% 50%;
  z-index:5;
  transition:.15s;
}

/* neck */

.neck{
  position:absolute;
  width:42px;
  height:45px;
  background:#efb9a7;
  left:70px;
  top:164px;
  z-index:1;
}

/* body */

.body{
  position:absolute;
  width:150px;
  height:92px;
  left:18px;
  top:175px;
  border-radius:65px 65px 25px 25px;
  background:
    linear-gradient(135deg,#a946d5,#6845d8);
  z-index:2;
  box-shadow:
    0 15px 30px rgba(0,0,0,.35);
}

/* talking */

.talking .mouth{
  width:26px;
  height:18px;
  border:3px solid #b74f72;
  background:#7f274e;
  border-radius:50%;
}

.talking .eye{
  transform:scaleY(.75);
}

.talking .avatar{
  animation:talkMove .55s infinite alternate;
}

@keyframes talkMove{
  from{transform:translateY(0)}
  to{transform:translateY(-3px)}
}

/* greeting */

.greeting{
  position:relative;
  z-index:3;
  margin-top:-5px;
  text-align:center;
}

.greeting h2{
  font-size:22px;
  font-weight:800;
}

.greeting p{
  color:#cdbddd;
  font-size:13px;
  margin-top:5px;
}

/* chat */

.chat{
  margin-top:18px;
  flex:1;
  max-height:245px;
  overflow-y:auto;
  padding:4px 2px;
  scrollbar-width:none;
}

.chat::-webkit-scrollbar{
  display:none;
}

.message{
  max-width:88%;
  padding:11px 14px;
  margin:8px 0;
  border-radius:18px;
  font-size:14px;
  line-height:1.55;
  animation:appear .25s ease;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.message.ai{
  margin-right:auto;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.08);
}

.message.user{
  margin-left:auto;
  background:linear-gradient(135deg,#c94de9,#7658ed);
}

/* input */

.input-area{
  margin-top:12px;
  display:flex;
  gap:9px;
  align-items:center;
}

.input-box{
  flex:1;
  height:52px;
  display:flex;
  align-items:center;
  padding:0 14px;
  border-radius:18px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(15px);
}

.input-box input{
  width:100%;
  background:none;
  border:none;
  outline:none;
  color:#fff;
  font-size:14px;
}

.input-box input::placeholder{
  color:#aaa0b5;
}

.send{
  width:52px;
  height:52px;
  border:none;
  border-radius:18px;
  color:#fff;
  font-size:20px;
  background:linear-gradient(135deg,#ed55b5,#7659ff);
  box-shadow:0 8px 25px rgba(181,67,231,.3);
}

/* mic */

.mic-area{
  display:flex;
  justify-content:center;
  margin-top:13px;
}

.mic{
  width:68px;
  height:68px;
  border:none;
  border-radius:50%;
  background:linear-gradient(135deg,#f15fc1,#7259ff);
  color:white;
  font-size:27px;
  box-shadow:
    0 10px 30px rgba(196,70,239,.35);
  transition:.2s;
}

.mic:active{
  transform:scale(.92);
}

.listening .mic{
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{
    box-shadow:0 0 0 0 rgba(240,93,194,.6);
  }
  70%{
    box-shadow:0 0 0 22px rgba(240,93,194,0);
  }
  100%{
    box-shadow:0 0 0 0 rgba(240,93,194,0);
  }
}

/* controls */

.controls{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:12px;
  flex-wrap:wrap;
}

.control{
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.06);
  color:#ddd3e4;
  border-radius:12px;
  padding:8px 11px;
  font-size:11px;
}

/* quick */

.quick{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-top:13px;
  scrollbar-width:none;
}

.quick::-webkit-scrollbar{
  display:none;
}

.quick button{
  flex:0 0 auto;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.06);
  color:#eee;
  padding:9px 13px;
  border-radius:14px;
  font-size:11px;
}

/* footer */

.footer{
  text-align:center;
  color:#80758b;
  font-size:9px;
  margin-top:13px;
}

/* loading */

.loading{
  display:inline-flex;
  gap:4px;
}

.loading span{
  width:5px;
  height:5px;
  border-radius:50%;
  background:#d88cff;
  animation:dot 1s infinite;
}

.loading span:nth-child(2){
  animation-delay:.15s;
}

.loading span:nth-child(3){
  animation-delay:.3s;
}

@keyframes dot{
  0%,100%{opacity:.25;transform:translateY(0)}
  50%{opacity:1;transform:translateY(-4px)}
}
</style>
</head>

<body>

<div class="bg-light light1"></div>
<div class="bg-light light2"></div>

<div class="app">

  <div class="header">

    <div class="logo">

      <div class="logo-icon">🐦</div>

      <div class="logo-text">
        <h1>ময়না পাখি</h1>
        <p>তোমার AI সহকারী</p>
      </div>

    </div>

    <div class="status">
      <span class="status-dot"></span>
      অনলাইন
    </div>

  </div>


  <div class="girl-section">

    <div class="girl-glow"></div>

    <div class="girl" id="girl">

      <div class="avatar">

        <div class="hair"></div>

        <div class="face"></div>

        <div class="bang"></div>

        <div class="eye left"></div>
        <div class="eye right"></div>

        <div class="nose"></div>

        <div class="mouth"></div>

        <div class="neck"></div>

        <div class="body"></div>

      </div>

    </div>

    <div class="greeting">

      <h2>হ্যালো! আমি ময়না 🩷</h2>

      <p id="statusText">
        আমার সাথে কথা বলো...
      </p>

    </div>

  </div>


  <div class="chat" id="chat">

    <div class="message ai">
      হ্যালো! আমি ময়না পাখি। তুমি আমাকে যেকোনো প্রশ্ন করতে পারো। 🩷
    </div>

  </div>


  <div class="quick">

    <button onclick="quickAsk('আজকের তারিখ কত?')">
      📅 তারিখ
    </button>

    <button onclick="quickAsk('এখন কয়টা বাজে?')">
      🕐 সময়
    </button>

    <button onclick="quickAsk('তুমি কী কী করতে পারো?')">
      🤖 কী পারো
    </button>

    <button onclick="quickAsk('একটা মজার কথা বলো')">
      😄 মজা
    </button>

  </div>


  <div class="input-area">

    <div class="input-box">

      <input
        id="textInput"
        type="text"
        placeholder="ময়নাকে কিছু বলো..."
        autocomplete="off"
      >

    </div>

    <button class="send" onclick="sendText()">
      ➤
    </button>

  </div>


  <div class="mic-area">

    <button
      class="mic"
      id="micBtn"
      onclick="startListening()"
    >
      🎙️
    </button>

  </div>


  <div class="controls">

    <button
      class="control"
      id="voiceBtn"
      onclick="toggleVoice()"
    >
      🔊 ভয়েস চালু
    </button>

    <button
      class="control"
      onclick="stopSpeaking()"
    >
      ⏹️ থামাও
    </button>

    <button
      class="control"
      onclick="clearChat()"
    >
      🗑️ পরিষ্কার
    </button>

  </div>


  <div class="footer">
    Moyna Pakhi AI • তোমার ব্যক্তিগত ভয়েস সহকারী
  </div>

</div>


<script>

/* =========================================
   CONFIG
========================================= */

const RENDER_URL =
  "https://jarvis-1-0yao.onrender.com";

let voiceEnabled = true;
let recognition = null;
let listening = false;


/* =========================================
   ELEMENTS
========================================= */

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("textInput");

const girl =
  document.getElementById("girl");

const statusText =
  document.getElementById("statusText");

const micBtn =
  document.getElementById("micBtn");


/* =========================================
   CHAT
========================================= */

function addMessage(text,type){

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  div.textContent =
    text;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;
}


/* =========================================
   REMOVE EMOJI FROM SPEECH
========================================= */

function cleanForSpeech(text){

  return text
    .replace(
      /[\u{1F000}-\u{1FAFF}]/gu,
      ""
    )
    .replace(
      /[\u{2600}-\u{27BF}]/gu,
      ""
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();

}


/* =========================================
   GET BANGLA VOICE
========================================= */

function getBanglaVoice(){

  const voices =
    speechSynthesis.getVoices();

  return (
    voices.find(v =>
      v.lang === "bn-BD"
    ) ||

    voices.find(v =>
      v.lang === "bn-IN"
    ) ||

    voices.find(v =>
      v.lang &&
      v.lang.toLowerCase()
       .startsWith("bn")
    ) ||

    null
  );

}


/* =========================================
   SPEAK
========================================= */

function speak(text){

  if(!voiceEnabled)
    return;

  if(!("speechSynthesis" in window))
    return;

  speechSynthesis.cancel();

  const clean =
    cleanForSpeech(text);

  if(!clean)
    return;

  const utter =
    new SpeechSynthesisUtterance(clean);

  const voice =
    getBanglaVoice();

  if(voice)
    utter.voice = voice;

  utter.lang =
    voice?.lang || "bn-BD";

  /*
     একটু মিষ্টি/স্বাভাবিক করার জন্য
  */

  utter.rate = 0.88;
  utter.pitch = 1.12;
  utter.volume = 1;

  utter.onstart = () => {

    girl.classList.add("talking");

    statusText.textContent =
      "আমি কথা বলছি... 🩷";

  };

  utter.onend = () => {

    girl.classList.remove("talking");

    statusText.textContent =
      "আর কিছু বলবে?";

  };

  utter.onerror = () => {

    girl.classList.remove("talking");

    statusText.textContent =
      "আবার বলো...";

  };

  speechSynthesis.speak(utter);

}


/* =========================================
   STOP SPEAKING
========================================= */

function stopSpeaking(){

  if("speechSynthesis" in window)
    speechSynthesis.cancel();

  girl.classList.remove("talking");

  statusText.textContent =
    "আমি শুনছি...";

}


/* =========================================
   VOICE TOGGLE
========================================= */

function toggleVoice(){

  voiceEnabled =
    !voiceEnabled;

  const btn =
    document.getElementById("voiceBtn");

  if(voiceEnabled){

    btn.textContent =
      "🔊 ভয়েস চালু";

  }else{

    speechSynthesis.cancel();

    girl.classList.remove("talking");

    btn.textContent =
      "🔇 ভয়েস বন্ধ";

  }

}


/* =========================================
   LOADING
========================================= */

function showLoading(){

  const div =
    document.createElement("div");

  div.className =
    "message ai";

  div.id =
    "loadingMessage";

  div.innerHTML = `
    <div class="loading">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

}


function removeLoading(){

  const el =
    document.getElementById(
      "loadingMessage"
    );

  if(el)
    el.remove();

}


/* =========================================
   SEND TEXT
========================================= */

async function sendText(){

  const text =
    input.value.trim();

  if(!text)
    return;

  input.value = "";

  await askAI(text);

}


/* =========================================
   QUICK ASK
========================================= */

function quickAsk(text){

  askAI(text);

}


/* =========================================
   ASK AI
========================================= */

async function askAI(message){

  if(!message)
    return;

  addMessage(
    message,
    "user"
  );

  statusText.textContent =
    "ভাবছি... 🤔";

  showLoading();

  try{

    const response =
      await fetch(
        RENDER_URL + "/api/ai",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message: message
            })
        }
      );


    const data =
      await response.json();


    removeLoading();


    if(!response.ok){

      throw new Error(
        data.error ||
        "AI উত্তর পাওয়া যায়নি"
      );

    }


    const answer =
      data.answer ||
      "দুঃখিত, কোনো উত্তর পাওয়া যায়নি।";


    addMessage(
      answer,
      "ai"
    );


    speak(answer);


  }catch(error){

    removeLoading();

    console.error(error);

    const errorText =
      "দুঃখিত, AI-এর সাথে এখন যোগাযোগ করা যাচ্ছে না। একটু পরে আবার চেষ্টা করো।";

    addMessage(
      errorText,
      "ai"
    );

    speak(errorText);

    statusText.textContent =
      "সংযোগে সমস্যা হয়েছে";

  }

}


/* =========================================
   SPEECH RECOGNITION
========================================= */

function setupRecognition(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    micBtn.disabled =
      true;

    micBtn.textContent =
      "❌";

    statusText.textContent =
      "এই ব্রাউজারে ভয়েস ইনপুট নেই";

    return;

  }


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "bn-BD";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    1;


  recognition.onstart =
    () => {

      listening = true;

      document.body.classList.add(
        "listening"
      );

      micBtn.textContent =
        "⏹️";

      statusText.textContent =
        "আমি শুনছি... বলো 🩷";

    };


  recognition.onresult =
    event => {

      const text =
        event.results[0][0].transcript;

      input.value =
        text;

      askAI(text);

    };


  recognition.onerror =
    event => {

      console.log(
        "Speech error:",
        event.error
      );

      statusText.textContent =
        "ঠিকমতো শুনতে পারিনি";

    };


  recognition.onend =
    () => {

      listening = false;

      document.body.classList.remove(
        "listening"
      );

      micBtn.textContent =
        "🎙️";

    };

}


/* =========================================
   START LISTENING
========================================= */

function startListening(){

  if(!recognition)
    setupRecognition();

  if(!recognition)
    return;


  if(listening){

    recognition.stop();

    return;

  }


  try{

    recognition.start();

  }catch(error){

    console.log(error);

  }

}


/* =========================================
   ENTER KEY
========================================= */

input.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      event.preventDefault();

      sendText();

    }

  }
);


/* =========================================
   CLEAR CHAT
========================================= */

function clearChat(){

  chat.innerHTML = `
    <div class="message ai">
      ঠিক আছে। আবার নতুন করে শুরু করি। 🩷
    </div>
  `;

}


/* =========================================
   LOAD VOICES
========================================= */

if("speechSynthesis" in window){

  speechSynthesis.onvoiceschanged =
    () => {

      speechSynthesis.getVoices();

    };

}
